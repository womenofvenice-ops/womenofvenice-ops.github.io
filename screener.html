<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Casting Screener • Women of Venice Studio</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1C2B2C;
      --inkS: #5A6667;
      --red: #A8492E;
      --peach: #E09A73;
      --gold: #D4AF37;
      --bg: #F7F5F0;
      --card: #FFFFFF;
      --border: rgba(28,43,44,0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 32px 16px 64px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 780px; margin: 0 auto; }
    
    /* Header Bar */
    .studio-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1.5px solid var(--border);
      flex-wrap: wrap;
      gap: 12px;
    }
    .studio-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--ink);
    }
    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .pdf-btn {
      background: var(--ink);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.2s ease;
    }
    .pdf-btn:hover { background: #334445; }
    .verified-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #F0FDF4;
      border: 1px solid #BBF7D0;
      color: #166534;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
      letter-spacing: 0.5px;
    }

    /* Hero Talent Card */
    .hero-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    }
    .hero-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .talent-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--red);
      background: rgba(168,73,46,0.08);
      padding: 4px 12px;
      border-radius: 99px;
    }
    .talent-ig {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--red);
      text-decoration: none;
    }
    .talent-ig:hover { text-decoration: underline; }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 34px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .archetype {
      font-size: 16px;
      font-weight: 700;
      color: var(--peach);
      margin-bottom: 16px;
    }
    .comps-box {
      background: #FAF9F6;
      border-left: 3.5px solid var(--red);
      border-radius: 8px;
      padding: 14px 18px;
      font-size: 13.5px;
      color: var(--ink);
      line-height: 1.6;
    }

    /* Video Player & Take Tabs */
    .video-card {
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      position: relative;
    }
    .video-tabs {
      display: flex;
      background: #111;
      padding: 8px;
      gap: 8px;
      border-bottom: 1px solid #222;
      overflow-x: auto;
    }
    .v-tab {
      background: #222;
      color: #999;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .v-tab.active {
      background: var(--red);
      color: #fff;
    }
    .video-frame-wrap {
      position: relative;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
    }
    .video-frame-wrap iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Telemetry Radar Section */
    .telemetry-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .section-title {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--inkS);
      margin-bottom: 18px;
    }
    .meter-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 13px; }
    .meter-lbl { flex: 0 0 240px; font-weight: 700; color: var(--ink); }
    .meter-bar { flex: 1; height: 8px; background: rgba(28,43,44,0.08); border-radius: 99px; overflow: hidden; }
    .meter-fill { height: 100%; background: linear-gradient(90deg, #A8492E, #E09A73); border-radius: 99px; }
    .meter-num { flex: 0 0 35px; text-align: right; font-weight: 800; color: var(--red); font-size: 13px; }

    /* Multi-Take Progression Delta Card */
    .progression-card {
      background: #FAF5FF;
      border: 1px solid #E9D5FF;
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 24px;
      font-size: 14px;
      line-height: 1.6;
    }

    /* Inquiries Footer */
    .inquire-bar {
      background: var(--ink);
      color: #fff;
      border-radius: 16px;
      padding: 28px;
      text-align: center;
    }
    .inquire-btn {
      display: inline-block;
      background: var(--red);
      color: #fff;
      padding: 12px 28px;
      border-radius: 99px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      margin-top: 14px;
      transition: background 0.2s;
    }
    .inquire-btn:hover { background: #8a3d28; }

    /* Bilingual Switcher */
    .lang-switcher {
      display: inline-flex;
      background: rgba(28,43,44,0.06);
      padding: 3px;
      border-radius: 99px;
      gap: 3px;
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: var(--inkS);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 99px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .lang-btn.active {
      background: var(--ink);
      color: #fff;
    }

    /* Mobile Responsive Meters */
    @media (max-width: 600px) {
      .meter-row { flex-wrap: wrap; gap: 4px; margin-bottom: 14px; }
      .meter-lbl { flex: 1 0 70%; font-size: 12px; }
      .meter-num { flex: 0 0 25%; font-size: 12px; text-align: right; }
      .meter-bar { flex: 1 0 100%; height: 7px; margin-top: 2px; }
      h1 { font-size: 28px; }
    }

    /* 📄 High-Status 1-Page PDF / Print Stylesheet */
    /* ⏱️ Interactive Clickable Timestamps */
    .ts-link {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: #0F172A;
      color: #38BDF8 !important;
      padding: 2px 7px;
      border-radius: 5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      font-size: 12px;
      text-decoration: none;
      border: 1px solid rgba(56, 189, 248, 0.3);
      cursor: pointer;
      transition: all 0.2s ease;
      vertical-align: baseline;
    }
    .ts-link:hover {
      background: #38BDF8;
      color: #0F172A !important;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(56, 189, 248, 0.4);
    }
    
    /* Playhead HUD Notice */
    #playheadHud {
      display: none;
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1.5px solid #38BDF8;
      color: #FFF;
      padding: 8px 20px;
      border-radius: 99px;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.3px;
      z-index: 10;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6), 0 0 12px rgba(56, 189, 248, 0.35);
      pointer-events: none;
      white-space: nowrap;
    }
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translate(-50%, 10px); }
      12% { opacity: 1; transform: translate(-50%, 0); }
      85% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -10px); }
    }

    /* Screen Mode: Hide print-only verification footer */
    .print-verification-footer { display: none; }
    /* 📄 High-Status 1-Page PDF / Print Styles */
    @media print {
      body {
        background: #fff !important;
        color: #111 !important;
        padding: 0 !important;
        font-size: 11.5px !important;
      }
      .ts-link { 
        background: transparent !important; 
        color: #000 !important; 
        border: 1px solid #999 !important; 
      }
      #playheadHud { 
        display: none !important; 
      }
      #brandPitchDrawer { 
        display: none !important; 
      }
      .container { 
        max-width: 100% !important; 
        margin: 0 !important; 
        padding: 0 !important; 
      }
      .video-card, .inquire-bar, .v-tab, .lang-switcher, #pdfExportBtn {
        display: none !important;
      }
      /* Print Mode: Activate High-Status Verification & QR Code Bar */
      .print-verification-footer {
        display: flex !important;
        justify-content: space-between;
        align-items: center;
        border-top: 1.5px solid #000 !important;
        padding-top: 12px !important;
        margin-top: 16px !important;
        page-break-inside: avoid !important;
      }
      .print-qr-code {
        width: 78px !important;
        height: 78px !important;
        display: block !important;
      }
      .print-cert-title {
        font-family: 'Playfair Display', Georgia, serif !important;
        font-size: 13px !important;
        font-weight: 800 !important;
        color: #000 !important;
        letter-spacing: 0.5px !important;
        margin-bottom: 2px !important;
      }
      .print-cert-text {
        font-size: 10px !important;
        color: #444 !important;
        line-height: 1.4 !important;
      }
      .studio-bar {
        border-bottom: 2px solid #000 !important;
        margin-bottom: 14px !important;
        padding-bottom: 8px !important;
      }
      .verified-pill {
        border: 1px solid #166534 !important;
        color: #166534 !important;
      }
      .hero-card, .telemetry-card, .progression-card {
        box-shadow: none !important;
        border: 1px solid #E2E8F0 !important;
        border-radius: 8px !important;
        padding: 14px 18px !important;
        margin-bottom: 12px !important;
        page-break-inside: avoid !important;
      }
      h1 { font-size: 24px !important; margin-bottom: 4px !important; }
      .archetype { font-size: 13px !important; margin-bottom: 10px !important; }
      .comps-box { padding: 8px 12px !important; font-size: 11px !important; }
      .section-title { margin-bottom: 10px !important; font-size: 10.5px !important; }
      .meter-row { margin-bottom: 8px !important; }
      .meter-lbl { font-size: 11px !important; flex: 0 0 260px !important; }
      .meter-bar { height: 6px !important; }
      .meter-num { font-size: 11px !important; }
    }
  </style>
</head>
<body>

<div class="container" id="app">
  <div style="text-align:center;padding:60px 0;color:var(--inkS);" id="loadingState">
    Loading official studio dossier...
  </div>
</div>

<script>
  const EXEC = "https://script.google.com/macros/s/AKfycbw1sia4uM2Xfc3_xP4umiZAPC77_XAyS4R86_oRgV1HHfM1CNRdRCG31SuCqJwFMc8/exec";
  const STUDIO_INQUIRY_EMAIL = "studio.wov@gmail.com";

  function esc(s) { 
    return String(s || "").replace(/[&<>"']/g, function(c) {
      return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
    }); 
  }

  function safeScore(val) {
    const n = Number(val);
    return (!isNaN(n) && n > 0 && n <= 100) ? Math.round(n) : null;
  }

  function getAppEl() {
    return document.getElementById("app") || document.querySelector(".container") || document.body;
  }

  window.addEventListener("DOMContentLoaded", function() {
    const params = new URLSearchParams(window.location.search);
    
    // 🛡️ Safe Parameter Resolution: Only recovers from localStorage if returning from Stripe/VIP (?pro=true)
    let targetName = params.get("name") || params.get("talent") || "";
    if (!targetName && params.get("pro")) {
      targetName = localStorage.getItem("wov_screener_talent") || "";
    }

    // Remember candidate in localStorage whenever explicitly viewed
    if (params.get("name") || params.get("talent")) {
      localStorage.setItem("wov_screener_talent", targetName);
    }

    // 🔄 Auto-repair address bar on return from payment/VIP
    if (!params.get("name") && targetName && window.history.replaceState) {
      const cleanUrl = window.location.pathname + '?name=' + encodeURIComponent(targetName) + (params.get("pro") ? '&pro=true' : '');
      window.history.replaceState({}, '', cleanUrl);
    }
// 🛰️ CLAUD-IA MILESTONE TELEMETRY DISPATCHER (Uses keepalive to survive unloads & Safari 302s)
    window.wovSendMilestone = function(eventType, meta) {
      if (!targetName) return;
      const payload = {
        action: "logEngagementEvent",
        talentId: targetName,
        eventType: eventType,
        meta: meta || {}
      };
      try {
        fetch(EXEC, {
          method: "POST",
          mode: "no-cors",
          keepalive: true,
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
      } catch (e) {}
    };

    // Milestone 1: Page Opened
    wovSendMilestone("PAGE_VIEW", { 
      referrer: document.referrer || "direct",
      ref: params.get("ref") || "web",
      isProView: params.get("pro") === "true"
    });
    
    const container = getAppEl();

    if (!targetName) {
      container.innerHTML = 
        '<div style="text-align:center;padding:60px 0;"><h2>⚠️ Missing Talent Parameter</h2><p style="color:var(--inkS);margin-top:8px;">Add ?name=TalentName to the URL to view a casting deck.</p></div>';
      return;
    }

    // 🌟 BUILT-IN STUDIO REFERENCE DEMOS (Works 100% offline & with empty databases)
    const rawTarget = typeof targetName !== "undefined" ? targetName : (new URLSearchParams(window.location.search).get("name") || "");
    const demoKey = String(rawTarget || "").toLowerCase().replace(/[.\-_]/g, " ").replace(/\s+/g, " ").trim();

    // 1. Intercept Studio Reference Profiles
    if (demoKey === "elena b" || demoKey === "elena" || demoKey === "marta creator" || demoKey === "marta") {
      if (typeof getDemoProfile_ === "function") {
        renderScreener(getDemoProfile_(demoKey));
        return;
      }
    }

    // Helper: Safe HTML escape fallback
    const safeEsc = typeof esc === "function" ? esc : function(s) {
      return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    };

    // 2. Fetch Live Database Record
    fetch(EXEC + "?action=screener&name=" + encodeURIComponent(rawTarget))
      .then(res => res.json())
      .then(data => {
        // Tolerant check for ok, found, or direct talent object
        if (!data || (!data.ok && !data.found && !data.dossier && !data.talent)) {
          const errMsg = (data && (data.error || data.message)) ? (data.error || data.message) : "No audition dossier available for this profile.";
          container.innerHTML = 
            '<div style="text-align:center;padding:60px 20px;">' +
              '<h2 style="font-size:22px;color:var(--text,#1C2B2C);margin-bottom:8px;">⚠️ Talent Brief Not Found</h2>' +
              '<p style="color:var(--inkS,#64748B);font-size:14px;max-width:440px;margin:0 auto 20px;">' + safeEsc(errMsg) + '</p>' +
              '<a href="index.html#casting-studio" style="display:inline-block;padding:9px 20px;background:var(--red,#A8492E);color:#FFF;border-radius:99px;text-decoration:none;font-size:13px;font-weight:700;">← Return to Studio Lab</a>' +
            '</div>';
          return;
        }
        renderScreener(data);
      })
      .catch(err => {
        container.innerHTML = 
          '<div style="text-align:center;padding:60px 20px;">' +
            '<h2 style="font-size:22px;color:var(--text,#1C2B2C);margin-bottom:8px;">📡 Studio Connection Error</h2>' +
            '<p style="color:var(--inkS,#64748B);font-size:13.5px;max-width:440px;margin:0 auto 20px;">' + safeEsc(err.message || err) + '</p>' +
            '<button onclick="window.location.reload()" style="padding:9px 20px;background:var(--text,#1C2B2C);color:#FFF;border:none;border-radius:99px;cursor:pointer;font-size:13px;font-weight:700;">Retry Connection</button>' +
          '</div>';
      });
  });

  function renderScreener(talent) {
    // 🛡️ 1. SAFE NAMES FIRST: Eliminates ReferenceError Temporal Dead Zone (TDZ)
    const rawTalentName = String(talent.name || "Talent").trim();
    const safeTalentName = esc(rawTalentName);
    const safeFirstName = esc(rawTalentName.split(" ")[0]);

    // 🚀 2. ROBUST CREATOR AMBITION DETECTION (Defined before liveScreenerUrl!)
    const params = new URLSearchParams(window.location.search);
    const typeParam = (params.get("type") || "").toLowerCase();
    const ambitionStr = String(talent.targetAmbition || params.get("format") || params.get("mode") || typeParam).toLowerCase();
    const isCreator = typeParam === "creator" || /short-form|creator|tiktok|reels|ugc|influencer/i.test(ambitionStr);

    // 🛡️ Artifact Verification: Clean URL for QR code & studio hash (Now safely reads isCreator!)
    const liveScreenerUrl = "https://womenofvenice.com/screener.html?name=" + encodeURIComponent(rawTalentName) + (isCreator ? "&type=creator" : "&type=cinema");
    const certHash = Math.abs(rawTalentName.split("").reduce((acc, char) => (acc << 5) - acc + char.charCodeAt(0), 0)).toString(16).toUpperCase().padStart(8, "0");
    const certId = "WOV-2026-" + certHash;
   
    // 💳 3. PRO MONETIZATION GATE & PERSISTENT UNLOCK
    const isPro = params.get("pro") === "true" || params.get("pro") === "1" || talent.isPro === true || localStorage.getItem("wov_unlocked_" + rawTalentName) === "true";
    if (isPro) {
      localStorage.setItem("wov_unlocked_" + rawTalentName, "true");
    }
    localStorage.setItem("wov_screener_talent", rawTalentName);
    
  // 🛡️ 4. TRACKABLE STRIPE PAYMENT LINK & SMART CHECKOUT ROUTER
    const baseStripeUrl = "https://buy.stripe.com/YOUR_STRIPE_LINK"; // 👈 Replace with live Stripe link when ready
    const stripePaymentUrl = (baseStripeUrl.indexOf("YOUR_STRIPE_LINK") >= 0)
      ? baseStripeUrl
      : (baseStripeUrl + "?client_reference_id=" + encodeURIComponent(rawTalentName));

   // 💳 SMART CHECKOUT ROUTER (Never Freezes · Auto-Scroll & Demo Safe)
    window.wovHandlePaymentClick = function(e) {
      if (e && e.preventDefault) e.preventDefault();
      try {
        localStorage.setItem("wov_screener_talent", rawTalentName);
      } catch (err) {}

      const cleanLowerName = rawTalentName.toLowerCase();
      const isDemo = cleanLowerName.indexOf("elena") >= 0 || cleanLowerName.indexOf("marta") >= 0;
      const isPlaceholder = !stripePaymentUrl || stripePaymentUrl.indexOf("YOUR_STRIPE_LINK") >= 0;

      // 🛡️ Demo Mode OR Unconfigured Stripe: Guide to VIP Scholarship
      if (isDemo || isPlaceholder) {
        const vipBox = document.getElementById("vipCodeInput");
        const statusEl = document.getElementById("vipCodeStatus");

        if (vipBox) {
          vipBox.scrollIntoView({ behavior: "smooth", block: "center" });
          setTimeout(function() { vipBox.focus(); }, 400);

          if (statusEl) {
            statusEl.style.color = "#F6E4B8";
            statusEl.innerHTML = "💡 Studio Demo: Enter <b>VENICE-VIP</b> below to unlock the complete verified dossier.";
          }
        } else {
          // Fail-safe prompt if element was not immediately found in DOM
          const entered = prompt("Studio Demonstration Mode:\nEnter scholarship code to unlock full evaluation dossier:", "VENICE-VIP");
          if (entered) {
            const inputEl = document.getElementById("vipCodeInput");
            if (inputEl) inputEl.value = entered;
            if (typeof wovRedeemVipCode === "function") wovRedeemVipCode();
          }
        }
        return false;
      }

      // 🚀 Real checkout link: Navigate to live checkout
      window.location.href = stripePaymentUrl;
    };
    window.wovPrepCheckout = window.wovHandlePaymentClick;
    
    const radar = talent.latestRadar || {};
    const comps = talent.comps || {};
    const takes = Array.isArray(talent.takes) && talent.takes.length > 0 ? talent.takes : [{}];
    const initialTakeIdx = takes.length - 1;

    // Cache state on window for dynamic, lossless take switching
    window._screenerState = {
      talent: talent,
      takes: takes,
      currentTakeIdx: initialTakeIdx,
      isCreator: isCreator,
      safeFirstName: safeFirstName,
      rawTalentName: rawTalentName
    };

    // 5. TELEMETRY SCORES & CONTEXTUAL INDEX TIERING
    const pScore = safeScore(radar.presenceScore);
    const vScore = safeScore(radar.vocalScore);
    const sScore = safeScore(radar.subtextScore);
    const fScore = safeScore(radar.formatFitScore);

    function getHookTier(score) {
      if (score >= 88) return "Top 5% Hook Velocity (Low Drop-Off Risk)";
      if (score >= 79) return "Top 15% Strong Front-End Retention";
      if (score >= 68) return "Average Hook Velocity (Moderate Friction)";
      return "High Front-End Drop-Off Risk";
    }
    const hookContext = isCreator && pScore ? ` · ${getHookTier(pScore)}` : "";

  // ⏱️ INTERACTIVE TIMECODE CONTROLLER (Smooth-Scrolls, Displays HUD & Seeks Native Video)
  window.wovSeekTimecode = function(timeStr) {
    if (!timeStr) return;
    
    // Extract timestamp, e.g. "00:14" or "0:14 - 0:25" -> "00:14"
    const match = String(timeStr).match(/\d{1,2}:\d{2}/);
    if (!match) return;
    const cleanTime = match[0];

    // 1. Smooth-scroll the video player directly into center view
    const videoCard = document.querySelector(".video-card");
    if (videoCard) {
      videoCard.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    // 2. Trigger High-Status Playhead Guidance HUD over the player
    let hud = document.getElementById("playheadHud");
    if (!hud && videoCard) {
      hud = document.createElement("div");
      hud.id = "playheadHud";
      videoCard.appendChild(hud);
    }
    if (hud) {
      hud.innerHTML = `⏱️ Directorial Marker [${cleanTime}] — Scrub player to ${cleanTime}`;
      hud.style.display = "block";
      hud.style.animation = "none";
      hud.offsetHeight; // force reflow
      hud.style.animation = "fadeInOut 3.8s forwards";
    }

    // 3. Programmatic Seek for HTML5 Native Video Players (Active when direct MP4/CDN is used)
    const nativeVid = document.getElementById("playerFrame") || document.querySelector("video");
    if (nativeVid && nativeVid.currentTime !== undefined) {
      const parts = cleanTime.split(":");
      const secs = (parseInt(parts[0], 10) * 60) + parseInt(parts[1], 10);
      nativeVid.currentTime = secs;
      nativeVid.play().catch(function(){});
    }
  };
