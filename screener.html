<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Casting Screener • Women of Venice Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="logo.png">
  <style>
    :root {
      --ink: #1C2B2C;
      --inkS: #5A6667;
      --red: #A8492E;
      --peach: #E09A73;
      --gold: #D4AF37;
      --bg: #F7F5F0;
      --card: #FFFFFF;
      --border: rgba(28,43,44,0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 32px 16px 64px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 780px; margin: 0 auto; }
    
    /* Header Bar */
    .studio-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1.5px solid var(--border);
      flex-wrap: wrap;
      gap: 12px;
    }
    .studio-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--ink);
    }
    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .pdf-btn {
      background: var(--ink);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.2s ease;
    }
    .pdf-btn:hover { background: #334445; }
    .verified-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #F0FDF4;
      border: 1px solid #BBF7D0;
      color: #166534;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
      letter-spacing: 0.5px;
    }

    /* Hero Talent Card */
    .hero-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    }
    .hero-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .talent-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--red);
      background: rgba(168,73,46,0.08);
      padding: 4px 12px;
      border-radius: 99px;
    }
    .talent-ig {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--red);
      text-decoration: none;
    }
    .talent-ig:hover { text-decoration: underline; }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 34px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .archetype {
      font-size: 16px;
      font-weight: 700;
      color: var(--peach);
      margin-bottom: 16px;
    }
    .comps-box {
      background: #FAF9F6;
      border-left: 3.5px solid var(--red);
      border-radius: 8px;
      padding: 14px 18px;
      font-size: 13.5px;
      color: var(--ink);
      line-height: 1.6;
    }

    /* Video Player & Take Tabs */
    .video-card {
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      position: relative;
    }
    .video-tabs {
      display: flex;
      background: #111;
      padding: 8px;
      gap: 8px;
      border-bottom: 1px solid #222;
      overflow-x: auto;
    }
    .v-tab {
      background: #222;
      color: #999;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .v-tab.active {
      background: var(--red);
      color: #fff;
    }
    .video-frame-wrap {
      position: relative;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
    }
    .video-frame-wrap iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Telemetry Radar Section */
    .telemetry-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .section-title {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--inkS);
      margin-bottom: 18px;
    }
    .meter-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 13px; }
    .meter-lbl { flex: 0 0 240px; font-weight: 700; color: var(--ink); }
    .meter-bar { flex: 1; height: 8px; background: rgba(28,43,44,0.08); border-radius: 99px; overflow: hidden; }
    .meter-fill { height: 100%; background: linear-gradient(90deg, #A8492E, #E09A73); border-radius: 99px; }
    .meter-num { flex: 0 0 35px; text-align: right; font-weight: 800; color: var(--red); font-size: 13px; }

    /* Multi-Take Progression Delta Card */
    .progression-card {
      background: #FAF5FF;
      border: 1px solid #E9D5FF;
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 24px;
      font-size: 14px;
      line-height: 1.6;
    }

    /* Inquiries Footer */
    .inquire-bar {
      background: var(--ink);
      color: #fff;
      border-radius: 16px;
      padding: 28px;
      text-align: center;
    }
    .inquire-btn {
      display: inline-block;
      background: var(--red);
      color: #fff;
      padding: 12px 28px;
      border-radius: 99px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      margin-top: 14px;
      transition: background 0.2s;
    }
    .inquire-btn:hover { background: #8a3d28; }

    /* Bilingual Switcher */
    .lang-switcher {
      display: inline-flex;
      background: rgba(28,43,44,0.06);
      padding: 3px;
      border-radius: 99px;
      gap: 3px;
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: var(--inkS);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 99px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .lang-btn.active {
      background: var(--ink);
      color: #fff;
    }

    /* Mobile Responsive Meters */
    @media (max-width: 600px) {
      .meter-row { flex-wrap: wrap; gap: 4px; margin-bottom: 14px; }
      .meter-lbl { flex: 1 0 70%; font-size: 12px; }
      .meter-num { flex: 0 0 25%; font-size: 12px; text-align: right; }
      .meter-bar { flex: 1 0 100%; height: 7px; margin-top: 2px; }
      h1 { font-size: 28px; }
    }

    /* 📄 High-Status 1-Page PDF / Print Stylesheet */
    /* ⏱️ Interactive Clickable Timestamps */
    .ts-link {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: #0F172A;
      color: #38BDF8 !important;
      padding: 2px 7px;
      border-radius: 5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      font-size: 12px;
      text-decoration: none;
      border: 1px solid rgba(56, 189, 248, 0.3);
      cursor: pointer;
      transition: all 0.2s ease;
      vertical-align: baseline;
    }
    .ts-link:hover {
      background: #38BDF8;
      color: #0F172A !important;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(56, 189, 248, 0.4);
    }
    
    /* Playhead HUD Notice */
    #playheadHud {
      display: none;
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1.5px solid #38BDF8;
      color: #FFF;
      padding: 8px 20px;
      border-radius: 99px;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.3px;
      z-index: 10;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6), 0 0 12px rgba(56, 189, 248, 0.35);
      pointer-events: none;
      white-space: nowrap;
    }
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translate(-50%, 10px); }
      12% { opacity: 1; transform: translate(-50%, 0); }
      85% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -10px); }
    }

    /* Screen Mode: Hide print-only verification footer */
    .print-verification-footer { display: none; }
    /* 📄 High-Status 1-Page PDF / Print Styles */
    @media print {
      body {
        background: #fff !important;
        color: #111 !important;
        padding: 0 !important;
        font-size: 11.5px !important;
      }
      .ts-link { 
        background: transparent !important; 
        color: #000 !important; 
        border: 1px solid #999 !important; 
      }
      #playheadHud { 
        display: none !important; 
      }
      .container { 
        max-width: 100% !important; 
        margin: 0 !important; 
        padding: 0 !important; 
      }
      .video-card, .inquire-bar, .v-tab, .lang-switcher, #pdfExportBtn {
        display: none !important;
      }
      /* Print Mode: Activate High-Status Verification & QR Code Bar */
      .print-verification-footer {
        display: flex !important;
        justify-content: space-between;
        align-items: center;
        border-top: 1.5px solid #000 !important;
        padding-top: 12px !important;
        margin-top: 16px !important;
        page-break-inside: avoid !important;
      }
      .print-qr-code {
        width: 78px !important;
        height: 78px !important;
        display: block !important;
      }
      .print-cert-title {
        font-family: 'Playfair Display', Georgia, serif !important;
        font-size: 13px !important;
        font-weight: 800 !important;
        color: #000 !important;
        letter-spacing: 0.5px !important;
        margin-bottom: 2px !important;
      }
      .print-cert-text {
        font-size: 10px !important;
        color: #444 !important;
        line-height: 1.4 !important;
      }
      .studio-bar {
        border-bottom: 2px solid #000 !important;
        margin-bottom: 14px !important;
        padding-bottom: 8px !important;
      }
      .verified-pill {
        border: 1px solid #166534 !important;
        color: #166534 !important;
      }
      .hero-card, .telemetry-card, .progression-card {
        box-shadow: none !important;
        border: 1px solid #E2E8F0 !important;
        border-radius: 8px !important;
        padding: 14px 18px !important;
        margin-bottom: 12px !important;
        page-break-inside: avoid !important;
      }
      h1 { font-size: 24px !important; margin-bottom: 4px !important; }
      .archetype { font-size: 13px !important; margin-bottom: 10px !important; }
      .comps-box { padding: 8px 12px !important; font-size: 11px !important; }
      .section-title { margin-bottom: 10px !important; font-size: 10.5px !important; }
      .meter-row { margin-bottom: 8px !important; }
      .meter-lbl { font-size: 11px !important; flex: 0 0 260px !important; }
      .meter-bar { height: 6px !important; }
      .meter-num { font-size: 11px !important; }
    }
  </style>
</head>
<body>

<div class="container" id="app">
  <div style="text-align:center;padding:60px 0;color:var(--inkS);" id="loadingState">
    Loading official studio dossier...
  </div>
</div>

<script>
  const EXEC = "https://script.google.com/macros/s/AKfycbw1sia4uM2Xfc3_xP4umiZAPC77_XAyS4R86_oRgV1HHfM1CNRdRCG31SuCqJwFMc8/exec";
  const STUDIO_INQUIRY_EMAIL = "studio.wov@gmail.com";

  function esc(s) { 
    return String(s || "").replace(/[&<>"']/g, function(c) {
      return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
    }); 
  }

  function safeScore(val) {
    const n = Number(val);
    return (!isNaN(n) && n > 0 && n <= 100) ? Math.round(n) : null;
  }

  function getAppEl() {
    return document.getElementById("app") || document.querySelector(".container") || document.body;
  }

  window.addEventListener("DOMContentLoaded", function() {
    const params = new URLSearchParams(window.location.search);
    
    // 🛡️ Safe Parameter Resolution: Only recovers from localStorage if returning from Stripe/VIP (?pro=true)
    let targetName = params.get("name") || params.get("talent") || "";
    if (!targetName && params.get("pro")) {
      targetName = localStorage.getItem("wov_screener_talent") || "";
    }

    // Remember candidate in localStorage whenever explicitly viewed
    if (params.get("name") || params.get("talent")) {
      localStorage.setItem("wov_screener_talent", targetName);
    }

    // 🔄 Auto-repair address bar on return from payment/VIP
    if (!params.get("name") && targetName && window.history.replaceState) {
      const cleanUrl = window.location.pathname + '?name=' + encodeURIComponent(targetName) + (params.get("pro") ? '&pro=true' : '');
      window.history.replaceState({}, '', cleanUrl);
    }

    const container = getAppEl();

    if (!targetName) {
      container.innerHTML = 
        '<div style="text-align:center;padding:60px 0;"><h2>⚠️ Missing Talent Parameter</h2><p style="color:var(--inkS);margin-top:8px;">Add ?name=TalentName to the URL to view a casting deck.</p></div>';
      return;
    }

    fetch(EXEC + "?action=screener&name=" + encodeURIComponent(targetName))
      .then(res => res.json())
      .then(data => {
        if (!data || !data.ok) {
          container.innerHTML = 
            '<div style="text-align:center;padding:60px 0;"><h2>⚠️ Talent Brief Not Found</h2><p style="color:var(--inkS);margin-top:8px;">' + (data ? esc(data.error) : "No record available") + '</p></div>';
          return;
        }
        renderScreener(data);
      })
      .catch(err => {
        container.innerHTML = 
          '<div style="text-align:center;padding:60px 0;"><h2>Network Error</h2><p style="color:var(--inkS);margin-top:8px;">' + esc(err.message || err) + '</p></div>';
      });
  });

  function renderScreener(talent) {
    // 🛡️ 1. SAFE NAMES FIRST: Eliminates ReferenceError Temporal Dead Zone (TDZ)
    const rawTalentName = String(talent.name || "Talent").trim();
    const safeTalentName = esc(rawTalentName);
    const safeFirstName = esc(rawTalentName.split(" ")[0]);

    // 🚀 2. ROBUST CREATOR AMBITION DETECTION (Defined before liveScreenerUrl!)
    const params = new URLSearchParams(window.location.search);
    const typeParam = (params.get("type") || "").toLowerCase();
    const ambitionStr = String(talent.targetAmbition || params.get("format") || params.get("mode") || typeParam).toLowerCase();
    const isCreator = typeParam === "creator" || /short-form|creator|tiktok|reels|ugc|influencer/i.test(ambitionStr);

    // 🛡️ Artifact Verification: Clean URL for QR code & studio hash (Now safely reads isCreator!)
    const liveScreenerUrl = "https://womenofvenice.com/screener.html?name=" + encodeURIComponent(rawTalentName) + (isCreator ? "&type=creator" : "&type=cinema");
    const certHash = Math.abs(rawTalentName.split("").reduce((acc, char) => (acc << 5) - acc + char.charCodeAt(0), 0)).toString(16).toUpperCase().padStart(8, "0");
    const certId = "WOV-2026-" + certHash;
   
    // 💳 3. PRO MONETIZATION GATE & PERSISTENT UNLOCK
    const isPro = params.get("pro") === "true" || params.get("pro") === "1" || talent.isPro === true || localStorage.getItem("wov_unlocked_" + rawTalentName) === "true";
    if (isPro) {
      localStorage.setItem("wov_unlocked_" + rawTalentName, "true");
    }
    localStorage.setItem("wov_screener_talent", rawTalentName);
    
    // 🛡️ 4. TRACKABLE STRIPE PAYMENT LINK (Attaches candidate name to Stripe receipt)
    const baseStripeUrl = "https://buy.stripe.com/YOUR_STRIPE_LINK";
    const stripePaymentUrl = baseStripeUrl + "?client_reference_id=" + encodeURIComponent(rawTalentName);

    window.wovPrepCheckout = function() {
      localStorage.setItem("wov_screener_talent", rawTalentName);
    };

    const radar = talent.latestRadar || {};
    const comps = talent.comps || {};
    const takes = Array.isArray(talent.takes) && talent.takes.length > 0 ? talent.takes : [{}];
    const initialTakeIdx = takes.length - 1;

    // Cache state on window for dynamic, lossless take switching
    window._screenerState = {
      talent: talent,
      takes: takes,
      currentTakeIdx: initialTakeIdx,
      isCreator: isCreator,
      safeFirstName: safeFirstName,
      rawTalentName: rawTalentName
    };

    // 5. TELEMETRY SCORES & CONTEXTUAL INDEX TIERING
    const pScore = safeScore(radar.presenceScore);
    const vScore = safeScore(radar.vocalScore);
    const sScore = safeScore(radar.subtextScore);
    const fScore = safeScore(radar.formatFitScore);

    function getHookTier(score) {
      if (score >= 88) return "Top 5% Hook Velocity (Low Drop-Off Risk)";
      if (score >= 79) return "Top 15% Strong Front-End Retention";
      if (score >= 68) return "Average Hook Velocity (Moderate Friction)";
      return "High Front-End Drop-Off Risk";
    }
    const hookContext = isCreator && pScore ? ` · ${getHookTier(pScore)}` : "";

    // 6. DYNAMIC CONVERSION PAYWALL CARD (Pre-built with €49 Anchor & VIP Pass Bypass)
    let paywallHtml = "";
    if (!isPro) {
      const config = isCreator ? {
        tag: "⚡ CREATOR MONETIZATION ACCELERATOR",
        title: "Secure High-Tier Brand Sponsorships (€1k–€3k)",
        desc: "Brands reject pitches when they suspect audience drop-off. Unlock your third-party audited 1-page PDF media sheet verifying your 3-second hook velocity and viewer retention.",
        btnText: "💼 Unlock Verified Media Kit Deck — €49",
        anchor: "€49 <span style='font-size:14px;color:#94A3B8;text-decoration:line-through;'>€99 Studio Rate</span>",
        benefit: "✓ Verified Retention Metrics · Brand-Ready Media Kit PDF · Commercial Comps"
      } : {
        tag: "🎭 OFFICIAL CASTING TELEMETRY DECK",
        title: "Arthouse Directability & Casting Dossier",
        desc: "Top casting directors review hundreds of tapes weekly. Provide an official studio-certified casting deck detailing your 4-axis micro-expression control, silence discipline, and European comps.",
        btnText: "📄 Unlock Official Casting Deck (PDF) — €49",
        anchor: "€49 <span style='font-size:14px;color:#94A3B8;text-decoration:line-through;'>€120 Studio Rate</span>",
        benefit: "✓ Certified Eye-Line Telemetry · 1-Page Agent Representation PDF · Director Comps"
      };

      paywallHtml = 
        '<div class="telemetry-card" style="background:linear-gradient(145deg,#162223,#243435);color:#FFF;border:1.5px solid var(--peach,#E8A87C);padding:32px 24px;text-align:center;margin-bottom:28px;border-radius:12px;box-shadow:0 12px 35px rgba(0,0,0,0.35);">' +
          '<div style="font-size:10.5px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--peach,#E8A87C);margin-bottom:8px;">' + config.tag + '</div>' +
          '<h3 style="font-size:22px;font-weight:800;margin-bottom:10px;color:#FFF;line-height:1.3;">' + config.title + '</h3>' +
          '<p style="font-size:13.5px;color:#CBD5E1;max-width:520px;margin:0 auto 18px;line-height:1.6;">' + config.desc + '</p>' +
          '<div style="font-size:28px;font-weight:800;color:#F6E4B8;margin-bottom:16px;">' + config.anchor + '</div>' +
          '<a href="' + stripePaymentUrl + '" onclick="wovPrepCheckout()" style="display:inline-block;background:var(--red,#E24E42);color:#FFF;padding:13px 32px;border-radius:99px;text-decoration:none;font-weight:800;font-size:14px;box-shadow:0 4px 14px rgba(226,78,66,0.4);transition:all 0.2s;">' + config.btnText + '</a>' +
          '<div style="font-size:11.5px;color:#94A3B8;margin-top:10px;">' + config.benefit + '</div>' +

          // 🎟️ VIP SCHOLARSHIP BYPASS
          '<div style="margin-top:28px;padding-top:22px;border-top:1px dashed rgba(246,228,184,0.25);">' +
            '<div style="font-size:13px;font-weight:700;color:#F6E4B8;margin-bottom:4px;">Have a Director\'s Scholarship Pass or Agency Code?</div>' +
            '<div style="font-size:11.5px;color:#94A3B8;margin-bottom:14px;">Enter your single-use credential to unlock your full evaluation.</div>' +
            '<div style="display:flex;gap:8px;max-width:320px;margin:0 auto;">' +
              '<input type="text" id="vipCodeInput" placeholder="ENTER ACCESS CODE" style="flex:1;padding:11px 14px;border-radius:8px;border:1.5px solid rgba(246,228,184,0.3);background:rgba(0,0,0,0.5);color:#FFF;font-size:13px;text-transform:uppercase;outline:none;font-weight:700;letter-spacing:1.5px;text-align:center;">' +
              '<button type="button" onclick="wovRedeemVipCode()" style="background:#22C55E;color:#0F172A;border:none;border-radius:8px;padding:11px 20px;font-size:13px;font-weight:800;cursor:pointer;transition:transform 0.1s;">Redeem</button>' +
            '</div>' +
            '<div id="vipCodeStatus" style="font-size:12px;margin-top:10px;min-height:16px;font-weight:600;"></div>' +
          '</div>' +
        '</div>';
    }

    // 🛡️ 7. FLATTENED HEADER ACTION BUTTON
    let headerActionBtnHtml = "";
    if (!isPro) {
      headerActionBtnHtml = 
        '<a href="' + stripePaymentUrl + '" onclick="wovPrepCheckout()" style="background:var(--red);color:#fff;padding:6px 14px;border-radius:6px;font-size:11.5px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:4px;">' +
          (isCreator ? '💼 Unlock Media Kit (€49)' : '📄 Unlock Casting Deck (€49)') +
        '</a>';
    } else {

  window.wovRedeemVipCode = function() {

      try {

    }

  // ⏱️ INTERACTIVE TIMECODE CONTROLLER (Smooth-Scrolls, Displays HUD & Seeks Native Video)
  window.wovSeekTimecode = function(timeStr) {
    if (!timeStr) return;
    
    // Extract timestamp, e.g. "00:14" or "0:14 - 0:25" -> "00:14"
    const match = String(timeStr).match(/\d{1,2}:\d{2}/);
    if (!match) return;
    const cleanTime = match[0];

    // 1. Smooth-scroll the video player directly into center view
    const videoCard = document.querySelector(".video-card");
    if (videoCard) {
      videoCard.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    // 2. Trigger High-Status Playhead Guidance HUD over the player
    let hud = document.getElementById("playheadHud");
    if (!hud && videoCard) {
      hud = document.createElement("div");
      hud.id = "playheadHud";
      videoCard.appendChild(hud);
    }
    if (hud) {
      hud.innerHTML = `⏱️ Directorial Marker [${cleanTime}] — Scrub player to ${cleanTime}`;
      hud.style.display = "block";
      hud.style.animation = "none";
      hud.offsetHeight; // force reflow
      hud.style.animation = "fadeInOut 3.8s forwards";
    }

    // 3. Programmatic Seek for HTML5 Native Video Players (Active when direct MP4/CDN is used)
    const nativeVid = document.getElementById("playerFrame") || document.querySelector("video");
    if (nativeVid && nativeVid.currentTime !== undefined) {
      const parts = cleanTime.split(":");
      const secs = (parseInt(parts[0], 10) * 60) + parseInt(parts[1], 10);
      nativeVid.currentTime = secs;
      nativeVid.play().catch(function(){});
    }
  };
</script>
