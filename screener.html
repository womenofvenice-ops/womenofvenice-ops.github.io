<script>
  const EXEC = "https://script.google.com/macros/s/AKfycbw1sia4uM2Xfc3_xP4umiZAPC77_XAyS4R86_oRgV1HHfM1CNRdRCG31SuCqJwFMc8/exec";

  function esc(s) { 
    return String(s || "").replace(/[&<>"]/g, function(c) {
      return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c];
    }); 
  }

  function safeScore(val) {
    const n = Number(val);
    return (!isNaN(n) && n >= 0 && n <= 100) ? Math.round(n) : 80;
  }

  window.addEventListener("DOMContentLoaded", function() {
    const params = new URLSearchParams(window.location.search);
    const targetName = params.get("name") || params.get("talent") || "";

    if (!targetName) {
      document.getElementById("app").innerHTML = 
        '<div style="text-align:center;padding:60px 0;"><h2>⚠️ Missing Talent Parameter</h2><p style="color:var(--inkS);margin-top:8px;">Add ?name=TalentName to the URL to view a casting deck.</p></div>';
      return;
    }

    fetch(EXEC + "?action=screener&name=" + encodeURIComponent(targetName))
      .then(res => res.json())
      .then(data => {
        if (!data || !data.ok) {
          document.getElementById("app").innerHTML = 
            '<div style="text-align:center;padding:60px 0;"><h2>⚠️ Talent Brief Not Found</h2><p style="color:var(--inkS);margin-top:8px;">' + (data ? esc(data.error) : "No data available") + '</p></div>';
          return;
        }
        renderScreener(data);
      })
      .catch(err => {
        document.getElementById("app").innerHTML = 
          '<div style="text-align:center;padding:60px 0;"><h2>Network Error</h2><p style="color:var(--inkS);margin-top:8px;">' + esc(err) + '</p></div>';
      });
  });

  // 👇 YOUR function renderScreener(talent) { ... } SITS RIGHT HERE! 👇
function renderScreener(talent) {
    const radar = talent.latestRadar || {};
    const comps = talent.comps || {};
    const takes = talent.takes || [];
    const latestTake = takes[takes.length - 1] || {};
    const dirNotes = latestTake.directorNotes || {};
    const fmtDiag = latestTake.formatDiag || {};
    const beatMap = latestTake.temporalBeatMap || latestTake.beatMap || [];

    let tabsHtml = "";
    if (takes.length > 1) {
      tabsHtml = '<div class="video-tabs">';
      takes.forEach((tk, idx) => {
        const activeClass = idx === (takes.length - 1) ? "active" : "";
        tabsHtml += `<button class="v-tab ${activeClass}" onclick="switchTakeVideo(${idx})">🎬 Take #${tk.takeNumber || (idx + 1)}</button>`;
      });
      tabsHtml += '</div>';
    }

    const initialVideo = latestTake.videoUrl || "";
    const pScore = safeScore(radar.presenceScore);
    const vScore = safeScore(radar.vocalScore);
    const sScore = safeScore(radar.subtextScore);
    const fScore = safeScore(radar.formatFitScore);
    const igHandle = talent.instagram ? String(talent.instagram).replace('@', '').trim() : '';

    // FIX: Escape HTML first, then apply timestamp badges, with pre-line support
    const rawCritique = esc(latestTake.talentFeedback || "");
    const styledCritique = rawCritique.replace(/\[?(\d{1,2}:\d{2}(?:\s*(?:-|–|to)\s*\d{1,2}:\d{2})?)\]?/g, 
      '<span style="background:#0F172A;color:#38BDF8;padding:2px 6px;border-radius:4px;font-family:monospace;font-weight:700;font-size:12.5px;">$1</span>'
    );

    // Safe talent name for greetings
    const safeFirstName = esc((talent.name || "Talent").split(" ")[0]);

    const html = `
      <div class="studio-bar">
        <div class="studio-title">Women of Venice • Casting Studio</div>
        <div class="verified-pill">✓ Verified CLAUD-IA Telemetry</div>
      </div>

      <!-- Hero Header -->
      <div class="hero-card">
        <div class="hero-top-row">
          <div class="talent-badge">${esc(talent.targetAmbition || "Feature Cinema Lead")}</div>
          ${igHandle ? `<a href="https://instagram.com/${esc(igHandle)}" target="_blank" class="talent-ig">📸 @${esc(igHandle)} ↗</a>` : ''}
        </div>
        <h1>${esc(talent.name || "Talent")}</h1>
        <div class="archetype">🎭 Archetype: ${esc(talent.marketArchetype || "Dramatic Lead")}</div>
        
        <div class="comps-box">
          <b>Director & Actor Comps:</b> ${esc(comps.actorComps || "Prestige Arthouse Matches")}<br>
          <span style="font-size:12.5px;color:var(--inkS);">Director Lane: ${esc(comps.directorFit || "A24 / Cannes Arthouse")}</span>
        </div>
      </div>

      <!-- Audition Video Player -->
      <div class="video-card">
        ${tabsHtml}
        <div class="video-frame-wrap" id="videoWrapper">
          ${initialVideo ? `<iframe id="playerFrame" src="${esc(initialVideo)}" allowfullscreen></iframe>` : '<div id="videoPlaceholder" style="color:#fff;text-align:center;padding:60px 0;">Video playback processing...</div>'}
        </div>
      </div>

      <!-- 4-Axis Telemetry Radar -->
      <div class="telemetry-card">
        <div class="section-title">📊 4-Axis Craft Telemetry (1–100)</div>
        <div class="meter-row">
          <div class="meter-lbl">👁️ Camera Stillness & Presence</div>
          <div class="meter-bar"><div class="meter-fill" style="width:${pScore}%"></div></div>
          <div class="meter-num">${pScore}</div>
        </div>
        <div class="meter-row">
          <div class="meter-lbl">🎙️ Vocal Resonance & Control</div>
          <div class="meter-bar"><div class="meter-fill" style="width:${vScore}%"></div></div>
          <div class="meter-num">${vScore}</div>
        </div>
        <div class="meter-row">
          <div class="meter-lbl">🎭 Subtext & Emotional Depth</div>
          <div class="meter-bar"><div class="meter-fill" style="width:${sScore}%"></div></div>
          <div class="meter-num">${sScore}</div>
        </div>
        <div class="meter-row">
          <div class="meter-lbl">🎯 Format Fit & Casting Match</div>
          <div class="meter-bar"><div class="meter-fill" style="width:${fScore}%"></div></div>
          <div class="meter-num">${fScore}</div>
        </div>
      </div>

      <!-- 🎬 Directorial Craft Assessment & Superpowers -->
      ${(dirNotes.superpower || dirNotes.blindspotToCorrect || fmtDiag.viabilityAssessment) ? `
        <div class="telemetry-card" style="border-left: 4px solid var(--red);">
          <div class="section-title">🎬 Directorial Craft Assessment</div>
          
          ${dirNotes.superpower ? `
            <div style="margin-bottom:12px;">
              <div style="font-size:11.5px;font-weight:800;color:var(--ink);text-transform:uppercase;">⚡ Natural Superpower</div>
              <div style="font-size:14px;color:var(--inkS);margin-top:2px;line-height:1.5;">${esc(dirNotes.superpower)}</div>
            </div>
          ` : ''}

          ${dirNotes.blindspotToCorrect ? `
            <div style="margin-bottom:12px;">
              <div style="font-size:11.5px;font-weight:800;color:var(--red);text-transform:uppercase;">⚠️ Performance Adjustment Focus</div>
              <div style="font-size:14px;color:var(--inkS);margin-top:2px;line-height:1.5;">${esc(dirNotes.blindspotToCorrect)}</div>
            </div>
          ` : ''}

          ${fmtDiag.viabilityAssessment ? `
            <div>
              <div style="font-size:11.5px;font-weight:800;color:var(--ink);text-transform:uppercase;">🎯 Platform & Market Viability</div>
              <div style="font-size:14px;color:var(--ink);font-weight:600;margin-top:2px;">${esc(fmtDiag.viabilityAssessment)}</div>
            </div>
          ` : ''}
        </div>
      ` : ''}

      <!-- 📝 Directorial Session Critique (With Paragraph Formatting) -->
      ${styledCritique ? `
        <div class="telemetry-card" style="background:#FAF8F5;">
          <div class="section-title">📝 Studio Directorial Critique</div>
          <div style="font-size:14.5px;line-height:1.7;color:var(--ink);white-space:pre-line;">${styledCritique}</div>
        </div>
      ` : ''}

      <!-- 📈 Multi-Take Directability Delta -->
      ${latestTake.progression && talent.takesCount > 1 ? `
        <div class="progression-card">
          <div style="font-weight:800;color:#6B21A8;margin-bottom:4px;">📈 Multi-Take Directability Delta</div>
          <div style="font-size:14px;color:var(--ink);line-height:1.5;">${esc(latestTake.progression)}</div>
        </div>
      ` : ''}

      <!-- ⏱️ Scene Beat Breakdown (Timestamped) -->
      ${beatMap.length > 0 ? `
        <div class="telemetry-card">
          <div class="section-title">⏱️ Scene Beat Breakdown & Structure</div>
          <div style="display:flex;flex-direction:column;gap:8px;">
            ${beatMap.map((b, bIdx) => `
              <div style="background:#fff;padding:10px 12px;border-radius:8px;border:1px solid rgba(28,43,44,0.08);display:flex;gap:12px;align-items:flex-start;">
                <div style="background:#0F172A;color:#38BDF8;font-family:monospace;font-size:11px;font-weight:700;padding:3px 6px;border-radius:5px;white-space:nowrap;">
                  ${esc(b.timestamp || ("Beat " + (bIdx + 1)))}
                </div>
                <div style="flex:1;">
                  <div style="font-weight:700;font-size:13px;color:var(--ink);">${esc(b.beatTitle || ("Beat #" + (bIdx + 1)))}</div>
                  ${b.characterIntent ? `<div style="font-size:12px;color:var(--inkS);margin-top:2px;">${esc(b.characterIntent)}</div>` : ''}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      ` : ''}

      <!-- Inquiries Footer -->
      <div class="inquire-bar">
        <h3 style="font-size:20px;font-weight:700;margin-bottom:6px;">Interested in Casting ${safeFirstName}?</h3>
        <p style="font-size:13.5px;color:#CBD5E1;max-width:480px;margin:0 auto;">
          Contact Women of Venice Casting Studio to request high-resolution masters, availability, or to schedule a direct callback session.
        </p>
        <a href="mailto:speakez14w@gmail.com?subject=Casting%20Inquiry%20—%20${encodeURIComponent(talent.name || 'Talent')}" class="inquire-btn">
          ✉️ Inquire for Casting / Representation
        </a>
      </div>
    `;

    document.getElementById("app").innerHTML = html;
    window._screenerTakes = takes;
  }

// 👆 YOUR function renderScreener(talent) ENDS RIGHT ABOVE HERE! 👆

  // Robust Tab Switcher for Multi-Take Video Players
  window.switchTakeVideo = function(idx) {
    const takes = window._screenerTakes || [];
    const targetTake = takes[idx];
    if (targetTake && targetTake.videoUrl) {
      const wrapper = document.getElementById("videoWrapper");
      let frame = document.getElementById("playerFrame");
      
      // If the iframe wasn't loaded initially, inject it cleanly
      if (!frame && wrapper) {
        wrapper.innerHTML = '<iframe id="playerFrame" src="' + esc(targetTake.videoUrl) + '" allowfullscreen></iframe>';
      } else if (frame) {
        frame.src = targetTake.videoUrl;
      }

      document.querySelectorAll(".v-tab").forEach((btn, bIdx) => {
        if (bIdx === idx) btn.classList.add("active");
        else btn.classList.remove("active");
      });
    }
  };
</script>

</body>
</html>
