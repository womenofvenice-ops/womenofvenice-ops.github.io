<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Casting Screener • Women of Venice Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="logo.png">
  <style>
    :root {
      --ink: #1C2B2C;
      --inkS: #5A6667;
      --red: #A8492E;
      --peach: #E09A73;
      --gold: #D4AF37;
      --bg: #F7F5F0;
      --card: #FFFFFF;
      --border: rgba(28,43,44,0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 32px 16px 64px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 780px; margin: 0 auto; }
    
    /* Header Bar */
    .studio-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1.5px solid var(--border);
      flex-wrap: wrap;
      gap: 12px;
    }
    .studio-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--ink);
    }
    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .pdf-btn {
      background: var(--ink);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.2s ease;
    }
    .pdf-btn:hover { background: #334445; }
    .verified-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #F0FDF4;
      border: 1px solid #BBF7D0;
      color: #166534;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
      letter-spacing: 0.5px;
    }

    /* Hero Talent Card */
    .hero-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    }
    .hero-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .talent-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--red);
      background: rgba(168,73,46,0.08);
      padding: 4px 12px;
      border-radius: 99px;
    }
    .talent-ig {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--red);
      text-decoration: none;
    }
    .talent-ig:hover { text-decoration: underline; }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 34px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .archetype {
      font-size: 16px;
      font-weight: 700;
      color: var(--peach);
      margin-bottom: 16px;
    }
    .comps-box {
      background: #FAF9F6;
      border-left: 3.5px solid var(--red);
      border-radius: 8px;
      padding: 14px 18px;
      font-size: 13.5px;
      color: var(--ink);
      line-height: 1.6;
    }

    /* Video Player & Take Tabs */
    .video-card {
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      position: relative;
    }
    .video-tabs {
      display: flex;
      background: #111;
      padding: 8px;
      gap: 8px;
      border-bottom: 1px solid #222;
      overflow-x: auto;
    }
    .v-tab {
      background: #222;
      color: #999;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .v-tab.active {
      background: var(--red);
      color: #fff;
    }
    .video-frame-wrap {
      position: relative;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
    }
    .video-frame-wrap iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Telemetry Radar Section */
    .telemetry-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .section-title {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--inkS);
      margin-bottom: 18px;
    }
    .meter-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 13px; }
    .meter-lbl { flex: 0 0 240px; font-weight: 700; color: var(--ink); }
    .meter-bar { flex: 1; height: 8px; background: rgba(28,43,44,0.08); border-radius: 99px; overflow: hidden; }
    .meter-fill { height: 100%; background: linear-gradient(90deg, #A8492E, #E09A73); border-radius: 99px; }
    .meter-num { flex: 0 0 35px; text-align: right; font-weight: 800; color: var(--red); font-size: 13px; }

    /* Multi-Take Progression Delta Card */
    .progression-card {
      background: #FAF5FF;
      border: 1px solid #E9D5FF;
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 24px;
      font-size: 14px;
      line-height: 1.6;
    }

    /* Inquiries Footer */
    .inquire-bar {
      background: var(--ink);
      color: #fff;
      border-radius: 16px;
      padding: 28px;
      text-align: center;
    }
    .inquire-btn {
      display: inline-block;
      background: var(--red);
      color: #fff;
      padding: 12px 28px;
      border-radius: 99px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      margin-top: 14px;
      transition: background 0.2s;
    }
    .inquire-btn:hover { background: #8a3d28; }

    /* Bilingual Switcher */
    .lang-switcher {
      display: inline-flex;
      background: rgba(28,43,44,0.06);
      padding: 3px;
      border-radius: 99px;
      gap: 3px;
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: var(--inkS);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 99px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .lang-btn.active {
      background: var(--ink);
      color: #fff;
    }

    /* Mobile Responsive Meters */
    @media (max-width: 600px) {
      .meter-row { flex-wrap: wrap; gap: 4px; margin-bottom: 14px; }
      .meter-lbl { flex: 1 0 70%; font-size: 12px; }
      .meter-num { flex: 0 0 25%; font-size: 12px; text-align: right; }
      .meter-bar { flex: 1 0 100%; height: 7px; margin-top: 2px; }
      h1 { font-size: 28px; }
    }

    /* 📄 High-Status 1-Page PDF / Print Stylesheet */
    /* ⏱️ Interactive Clickable Timestamps */
    .ts-link {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: #0F172A;
      color: #38BDF8 !important;
      padding: 2px 7px;
      border-radius: 5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      font-size: 12px;
      text-decoration: none;
      border: 1px solid rgba(56, 189, 248, 0.3);
      cursor: pointer;
      transition: all 0.2s ease;
      vertical-align: baseline;
    }
    .ts-link:hover {
      background: #38BDF8;
      color: #0F172A !important;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(56, 189, 248, 0.4);
    }
    
    /* Playhead HUD Notice */
    #playheadHud {
      display: none;
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid #38BDF8;
      color: #FFF;
      padding: 7px 18px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      z-index: 10;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      pointer-events: none;
    }
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translate(-50%, 8px); }
      15% { opacity: 1; transform: translate(-50%, 0); }
      80% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -8px); }
    }/* 📄 High-Status 1-Page PDF / Print Styles */
    @media print {
      body {
        background: #fff !important;
        color: #111 !important;
        padding: 0 !important;
        font-size: 11.5px !important;
      }
      .ts-link { 
        background: transparent !important; 
        color: #000 !important; 
        border: 1px solid #999 !important; 
      }
      #playheadHud { 
        display: none !important; 
      }
      .container { 
        max-width: 100% !important; 
        margin: 0 !important; 
        padding: 0 !important; 
      }
      .video-card, .inquire-bar, .v-tab, .lang-switcher, #pdfExportBtn {
        display: none !important;
      }
      .studio-bar {
        border-bottom: 2px solid #000 !important;
        margin-bottom: 14px !important;
        padding-bottom: 8px !important;
      }
      .verified-pill {
        border: 1px solid #166534 !important;
        color: #166534 !important;
      }
      .hero-card, .telemetry-card, .progression-card {
        box-shadow: none !important;
        border: 1px solid #E2E8F0 !important;
        border-radius: 8px !important;
        padding: 14px 18px !important;
        margin-bottom: 12px !important;
        page-break-inside: avoid !important;
      }
      h1 { font-size: 24px !important; margin-bottom: 4px !important; }
      .archetype { font-size: 13px !important; margin-bottom: 10px !important; }
      .comps-box { padding: 8px 12px !important; font-size: 11px !important; }
      .section-title { margin-bottom: 10px !important; font-size: 10.5px !important; }
      .meter-row { margin-bottom: 8px !important; }
      .meter-lbl { font-size: 11px !important; flex: 0 0 260px !important; }
      .meter-bar { height: 6px !important; }
      .meter-num { font-size: 11px !important; }
    }
  </style>
</head>
<body>

<div class="container" id="app">
  <div style="text-align:center;padding:60px 0;color:var(--inkS);" id="loadingState">
    Loading official studio dossier...
  </div>
</div>

<script>
  const EXEC = "https://script.google.com/macros/s/AKfycbw1sia4uM2Xfc3_xP4umiZAPC77_XAyS4R86_oRgV1HHfM1CNRdRCG31SuCqJwFMc8/exec";
  const STUDIO_INQUIRY_EMAIL = "studio.wov@gmail.com";

  function esc(s) { 
    return String(s || "").replace(/[&<>"']/g, function(c) {
      return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
    }); 
  }

  function safeScore(val) {
    const n = Number(val);
    return (!isNaN(n) && n > 0 && n <= 100) ? Math.round(n) : null;
  }

// 🛡️ Safe Container Resolver: NEVER returns null
  function getAppEl() {
    return document.getElementById("app") || document.querySelector(".container") || document.body;
  }

  window.addEventListener("DOMContentLoaded", function() {
    const params = new URLSearchParams(window.location.search);
    
    // 🛡️ 1. Safe Parameter Resolution: Recovers candidate name if returning from Stripe (?pro=true)
    let rawName = params.get("name") || params.get("talent") || "";
    let targetName = String(rawName).trim();
    
    const isProReturn = params.get("pro") === "true" || params.get("pro") === "1";

    if (!targetName && isProReturn) {
      targetName = String(localStorage.getItem("wov_screener_talent") || "").trim();
    }

    // 🛡️ 2. Cache candidate in localStorage whenever explicitly viewed
    if (targetName) {
      localStorage.setItem("wov_screener_talent", targetName);
    }

    // 🔄 3. Auto-repair address bar on return from Stripe checkout
    if (!rawName && targetName && window.history.replaceState) {
      const cleanUrl = window.location.pathname + '?name=' + encodeURIComponent(targetName) + (isProReturn ? '&pro=true' : '');
      window.history.replaceState({}, '', cleanUrl);
    }

    const container = getAppEl();

    if (!targetName) {
      container.innerHTML = 
        '<div style="text-align:center;padding:60px 0;"><h2>⚠️ Missing Talent Parameter</h2><p style="color:var(--inkS);margin-top:8px;">Add ?name=TalentName to the URL to view a casting deck.</p></div>';
      return;
    }

    fetch(EXEC + "?action=screener&name=" + encodeURIComponent(targetName))
      .then(res => res.json())
      .then(data => {
        if (!data || !data.ok) {
          container.innerHTML = 
            '<div style="text-align:center;padding:60px 0;"><h2>⚠️ Talent Brief Not Found</h2><p style="color:var(--inkS);margin-top:8px;">' + (data ? esc(data.error) : "No record available") + '</p></div>';
          return;
        }
        renderScreener(data);
      })
      .catch(err => {
        container.innerHTML = 
          '<div style="text-align:center;padding:60px 0;"><h2>Network Error</h2><p style="color:var(--inkS);margin-top:8px;">' + esc(err.message || err) + '</p></div>';
      });
  });
  function renderScreener(talent) {
    // 🛡️ 1. SAFE NAMES FIRST: Eliminates ReferenceError Temporal Dead Zone (TDZ)
    const rawTalentName = String(talent.name || "Talent").trim();
    const safeTalentName = esc(rawTalentName);
    const safeFirstName = esc(rawTalentName.split(" ")[0]);

    // 🚀 2. ROBUST CREATOR AMBITION DETECTION (Regex + ?type= / ?format= / ?mode=)
    const params = new URLSearchParams(window.location.search);
    const typeParam = (params.get("type") || "").toLowerCase();
    const ambitionStr = String(talent.targetAmbition || params.get("format") || params.get("mode") || typeParam).toLowerCase();
    const isCreator = typeParam === "creator" || /short-form|creator|tiktok|reels|ugc|influencer/i.test(ambitionStr);
   
    // 🛡️ 3. PRO MONETIZATION GATE (Safe against Safari Private Mode & Instagram Browser crashes)
    let isProStored = false;
    try {
      isProStored = localStorage.getItem("wov_unlocked_" + rawTalentName) === "true";
    } catch (eStorage) {}

    const isPro = params.get("pro") === "true" || params.get("pro") === "1" || talent.isPro === true || isProStored;
    
    if (isPro) {
      try { localStorage.setItem("wov_unlocked_" + rawTalentName, "true"); } catch (eStorage) {}
    }
    try { localStorage.setItem("wov_screener_talent", rawTalentName); } catch (eStorage) {}
    
    // 🛡️ 4. TRACKABLE STRIPE PAYMENT LINK (Attaches candidate name to Stripe receipt)
    const baseStripeUrl = "https://buy.stripe.com/YOUR_STRIPE_LINK"; // 👈 Replace with your actual Stripe Link
    const stripePaymentUrl = baseStripeUrl + "?client_reference_id=" + encodeURIComponent(rawTalentName);

    window.wovPrepCheckout = function() {
      try { localStorage.setItem("wov_screener_talent", rawTalentName); } catch (eStorage) {}
    };

    const radar = talent.latestRadar || {};
    const comps = talent.comps || {};
    const takes = Array.isArray(talent.takes) && talent.takes.length > 0 ? talent.takes : [{}];
    const initialTakeIdx = takes.length - 1;
    const latestTake = takes[initialTakeIdx] || {};
    const dirNotes = latestTake.directorNotes || {};
    const fmtDiag = latestTake.formatDiag || {};
    const beatMap = latestTake.temporalBeatMap || latestTake.beatMap || [];

    // Cache state on window for dynamic take switching
    window._screenerState = {
      talent: talent,
      takes: takes,
      currentTakeIdx: initialTakeIdx,
      isCreator: isCreator,
      safeFirstName: safeFirstName,
      rawTalentName: rawTalentName
    };

    // 5. TELEMETRY SCORES & CONTEXTUAL INDEX TIERING
    const pScore = safeScore(radar.presenceScore);
    const vScore = safeScore(radar.vocalScore);
    const sScore = safeScore(radar.subtextScore);
    const fScore = safeScore(radar.formatFitScore);
    const igHandle = talent.instagram ? String(talent.instagram).replace('@', '').trim() : '';

    // 6. MULTI-TAKE TABS
    let tabsHtml = "";
    if (takes.length > 1) {
      tabsHtml = '<div class="video-tabs">';
      takes.forEach((tk, idx) => {
        const activeClass = idx === initialTakeIdx ? "active" : "";
        tabsHtml += '<button class="v-tab ' + activeClass + '" onclick="switchTakeVideo(' + idx + ')">🎬 Take #' + (tk.takeNumber || (idx + 1)) + '</button>';
      });
      tabsHtml += '</div>';
    }

    // 7. PRE-BUILD VIDEO EMBED
    const initialVideo = latestTake.videoUrl || "";
    let videoEmbedHtml = '<div id="videoPlaceholder" style="color:#fff;text-align:center;padding:60px 0;font-size:14px;">Video playback processing or awaiting upload...</div>';
    if (initialVideo && String(initialVideo).indexOf("http") === 0) {
      videoEmbedHtml = '<iframe id="playerFrame" src="' + esc(initialVideo) + '" allowfullscreen></iframe>';
    }

    // 8. BILINGUAL CRITIQUE ENGINE
    const detectedLang = latestTake.detectedLanguage || "English";
    const isNonEnglish = detectedLang.toLowerCase() !== "english" && detectedLang.toLowerCase() !== "en";
    const rawCritiqueEN = esc(latestTake.talentFeedback || "");
    const rawCritiqueLocal = esc(latestTake.talentFeedbackLocal || rawCritiqueEN);
    
    const hasTranslation = isNonEnglish && rawCritiqueLocal && (rawCritiqueLocal !== rawCritiqueEN);
    const defaultToLocal = hasTranslation;

    const timestampRegex = /\[?(\d{1,2}:\d{2}(?:\s*(?:-|–|to)\s*\d{1,2}:\d{2})?)\]?/g;
    // ⏱️ Clickable Interactive Timecode Trigger
    const badgeSpan = '<button type="button" class="ts-link" onclick="wovSeekTimecode(\'$1\')" title="Seek video to $1">▶ $1</button>';
    const styledCritiqueEN = rawCritiqueEN.replace(timestampRegex, badgeSpan);
    const styledCritiqueLocal = rawCritiqueLocal.replace(timestampRegex, badgeSpan);

    let critiqueCardHtml = "";
    if (styledCritiqueEN || styledCritiqueLocal) {
      const langLabel = esc(detectedLang.slice(0,3).toUpperCase());
      critiqueCardHtml = 
        '<div class="telemetry-card" style="background:#FAF8F5;">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">' +
            '<div class="section-title" style="margin-bottom:0;">📝 Studio Directorial Critique</div>' +
            (hasTranslation ? 
              '<div class="lang-switcher">' +
                '<button class="lang-btn ' + (defaultToLocal ? 'active' : '') + '" id="btnLangLocal" onclick="toggleCritiqueLang(\'local\')">' + langLabel + '</button>' +
                '<button class="lang-btn ' + (!defaultToLocal ? 'active' : '') + '" id="btnLangEN" onclick="toggleCritiqueLang(\'en\')">EN</button>' +
              '</div>' : '') +
          '</div>' +
          '<div id="critiqueTextLocal" style="' + (defaultToLocal ? 'display:block;' : 'display:none;') + 'font-size:14.5px;line-height:1.7;color:var(--ink);white-space:pre-line;">' + styledCritiqueLocal + '</div>' +
          '<div id="critiqueTextEN" style="' + (!defaultToLocal ? 'display:block;' : 'display:none;') + 'font-size:14.5px;line-height:1.7;color:var(--ink);white-space:pre-line;">' + styledCritiqueEN + '</div>' +
        '</div>';
    }

    // 9. PRE-BUILD DIRECTORIAL ASSESSMENT
    let dirNotesHtml = "";
    if (dirNotes.superpower || dirNotes.blindspotToCorrect || fmtDiag.viabilityAssessment) {
      dirNotesHtml = 
        '<div class="telemetry-card" style="border-left: 4px solid var(--red);">' +
          '<div class="section-title">🎬 Directorial Craft Assessment</div>' +
          (dirNotes.superpower ? '<div style="margin-bottom:12px;"><div style="font-size:11.5px;font-weight:800;color:var(--ink);text-transform:uppercase;">⚡ Natural Superpower</div><div style="font-size:14px;color:var(--inkS);margin-top:2px;line-height:1.5;">' + esc(dirNotes.superpower) + '</div></div>' : '') +
          (dirNotes.blindspotToCorrect ? '<div style="margin-bottom:12px;"><div style="font-size:11.5px;font-weight:800;color:var(--red);text-transform:uppercase;">⚠️ Performance Adjustment Focus</div><div style="font-size:14px;color:var(--inkS);margin-top:2px;line-height:1.5;">' + esc(dirNotes.blindspotToCorrect) + '</div></div>' : '') +
          (fmtDiag.viabilityAssessment ? '<div><div style="font-size:11.5px;font-weight:800;color:var(--ink);text-transform:uppercase;">🎯 Platform & Market Viability</div><div style="font-size:14px;color:var(--ink);font-weight:600;margin-top:2px;">' + esc(fmtDiag.viabilityAssessment) + '</div></div>' : '') +
        '</div>';
    }

    // 10. PRE-BUILD MULTI-TAKE PROGRESSION
    let progressionHtml = "";
    if (latestTake.progression && talent.takesCount > 1) {
      progressionHtml = 
        '<div class="progression-card">' +
          '<div style="font-weight:800;color:#6B21A8;margin-bottom:4px;">📈 Multi-Take Directability Delta</div>' +
          '<div style="font-size:14px;color:var(--ink);line-height:1.5;">' + esc(latestTake.progression) + '</div>' +
        '</div>';
    }

    // 11. PRE-BUILD BEAT BREAKDOWN CARDS
    let beatMapHtml = "";
    if (beatMap.length > 0) {
      beatMapHtml = 
        '<div class="telemetry-card">' +
          '<div class="section-title">⏱️ Scene Beat Breakdown & Structure</div>' +
          '<div style="display:flex;flex-direction:column;gap:8px;">';
      beatMap.forEach((b, bIdx) => {
        const rawTs = esc(b.timestamp || ("Beat " + (bIdx + 1)));
        const isTimecode = /\d{1,2}:\d{2}/.test(rawTs);
        
        beatMapHtml += `
          <div style="background:#fff;padding:10px 12px;border-radius:8px;border:1px solid rgba(28,43,44,0.08);display:flex;gap:12px;align-items:flex-start;">
            ${isTimecode ? `
              <button type="button" class="ts-link" style="font-size:11px;padding:3px 6px;white-space:nowrap;" onclick="wovSeekTimecode('${rawTs}')" title="Inspect Beat">
                ▶ ${rawTs}
              </button>

    const html = `

  // 🔄 SYNCHRONIZED TAKE SWITCHER: Updates Video, Critique, Notes, and Beat Breakdown
  window.switchTakeVideo = function(idx) {
    const state = window._screenerState;
    if (!state || !state.takes) return;

    const takes = state.takes;
    const targetTake = takes[idx] || takes[takes.length - 1] || {};
    state.currentTakeIdx = idx;

    // 1. Update Video Frame or Empty State + Direct Pop-Out Link
    const wrapper = document.getElementById("videoWrapper");
    const directLinkWrap = document.getElementById("videoDirectLinkWrap");

    if (targetTake.videoUrl && String(targetTake.videoUrl).indexOf("http") === 0) {
      if (wrapper) {
        wrapper.innerHTML = `<iframe id="playerFrame" src="${esc(targetTake.videoUrl)}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
      }
      if (directLinkWrap) {
        directLinkWrap.innerHTML = `<a href="${esc(targetTake.videoUrl)}" target="_blank" rel="noopener noreferrer" style="color:#94A3B8;font-size:12px;text-decoration:none;font-weight:700;display:inline-flex;align-items:center;gap:4px;">🎬 Open Fullscreen Player ↗</a>`;
      }
    } else {
      if (wrapper) {
        wrapper.innerHTML = `
          <div id="videoPlaceholder" style="position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#94A3B8;padding:20px;text-align:center;">
            <div style="font-size:32px;margin-bottom:8px;">⏳</div>
            <div style="font-size:14px;font-weight:600;">Playback Processing for Take #${targetTake.takeNumber || (idx + 1)}</div>
            <div style="font-size:12px;color:#64748B;margin-top:4px;">Master video file is currently synchronizing with streaming CDN.</div>
          </div>`;
      }
      if (directLinkWrap) {
        directLinkWrap.innerHTML = "";
      }
    }

    // 2. Synchronize Tab Highlights
    document.querySelectorAll(".v-tab").forEach((btn, bIdx) => {
      btn.classList.toggle("active", bIdx === idx);
    });

    // 3. Render Take-Specific Critique, Notes, & Beat Map
    const dynamicContainer = document.getElementById("dynamicTakeContainer");
    if (dynamicContainer) {
      dynamicContainer.innerHTML = buildTakeContentHtml(targetTake, state.isCreator, idx, takes.length);
    }
  };

  // 📝 SUB-RENDERER: Generates synchronized critique and assessment for the active take
  function buildTakeContentHtml(tk, isCreator, idx, totalTakes) {
    const dirNotes = tk.directorNotes || {};
    const fmtDiag = tk.formatDiag || {};
    const beatMap = tk.temporalBeatMap || tk.beatMap || [];
    const takeLabel = totalTakes > 1 ? ` (Take #${tk.takeNumber || (idx + 1)})` : "";

    // Titles
    const assessTitle = (isCreator ? "💼 Brand Deal & Viral Retention Audit" : "🎬 Directorial Craft Assessment") + takeLabel;
    const superTitle = isCreator ? "⚡ Viral Magnet Asset" : "⚡ Natural Superpower";
    const blindTitle = isCreator ? "⚠️ Viewer Retention Drop-off Risk" : "⚠️ Performance Adjustment Focus";
    const viabTitle = isCreator ? "🎯 Sponsorship & Ad Conversion Viability" : "🎯 Platform & Market Viability";

    // Directorial Assessment Box
    let dirNotesHtml = "";
    if (dirNotes.superpower || dirNotes.blindspotToCorrect || fmtDiag.viabilityAssessment) {
      dirNotesHtml = `
        <div class="telemetry-card" style="border-left: 4px solid var(--red);">
          <div class="section-title">${assessTitle}</div>
          ${dirNotes.superpower ? `
            <div style="margin-bottom:12px;">
              <div style="font-size:11.5px;font-weight:800;color:var(--ink);text-transform:uppercase;">${superTitle}</div>
              <div style="font-size:14px;color:var(--inkS);margin-top:2px;line-height:1.5;">${esc(dirNotes.superpower)}</div>
            </div>` : ''}
          ${dirNotes.blindspotToCorrect ? `
            <div style="margin-bottom:12px;">
              <div style="font-size:11.5px;font-weight:800;color:var(--red);text-transform:uppercase;">${blindTitle}</div>
              <div style="font-size:14px;color:var(--inkS);margin-top:2px;line-height:1.5;">${esc(dirNotes.blindspotToCorrect)}</div>
            </div>` : ''}
          ${fmtDiag.viabilityAssessment ? `
            <div>
              <div style="font-size:11.5px;font-weight:800;color:var(--ink);text-transform:uppercase;">${viabTitle}</div>
              <div style="font-size:14px;color:var(--ink);font-weight:600;margin-top:2px;">${esc(fmtDiag.viabilityAssessment)}</div>
            </div>` : ''}
        </div>`;
    }

    // Bilingual Critique Box
    const detectedLang = tk.detectedLanguage || "English";
    const isNonEnglish = detectedLang.toLowerCase() !== "english" && detectedLang.toLowerCase() !== "en";
    const rawCritiqueEN = esc(tk.talentFeedback || "");
    const rawCritiqueLocal = esc(tk.talentFeedbackLocal || rawCritiqueEN);
    const hasTranslation = isNonEnglish && rawCritiqueLocal && (rawCritiqueLocal !== rawCritiqueEN);
    const defaultToLocal = hasTranslation;

    const timestampRegex = /\[?(\d{1,2}:\d{2}(?:\s*(?:-|–|to)\s*\d{1,2}:\d{2})?)\]?/g;
    const badgeSpan = '<span style="background:#0F172A;color:#38BDF8;padding:2px 6px;border-radius:4px;font-family:monospace;font-weight:700;font-size:12px;">$1</span>';
    const styledCritiqueEN = rawCritiqueEN.replace(timestampRegex, badgeSpan);
    const styledCritiqueLocal = rawCritiqueLocal.replace(timestampRegex, badgeSpan);

    let critiqueCardHtml = "";
    if (styledCritiqueEN || styledCritiqueLocal) {
      const langLabel = esc(detectedLang.slice(0, 3).toUpperCase());
      const critiqueHeading = (isCreator ? "📋 Studio Retention & Script Critique" : "📝 Studio Directorial Critique") + takeLabel;

      critiqueCardHtml = `
        <div class="telemetry-card" style="background:#FAF8F5;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
            <div class="section-title" style="margin-bottom:0;">${critiqueHeading}</div>
            ${hasTranslation ? `
              <div class="lang-switcher">
                <button class="lang-btn ${defaultToLocal ? 'active' : ''}" id="btnLangLocal" onclick="toggleCritiqueLang('local')">${langLabel}</button>
                <button class="lang-btn ${!defaultToLocal ? 'active' : ''}" id="btnLangEN" onclick="toggleCritiqueLang('en')">EN</button>
              </div>` : ''}
          </div>
          <div id="critiqueTextLocal" style="${defaultToLocal ? 'display:block;' : 'display:none;'}font-size:14.5px;line-height:1.7;color:var(--ink);white-space:pre-line;">${styledCritiqueLocal}</div>
          <div id="critiqueTextEN" style="${!defaultToLocal ? 'display:block;' : 'display:none;'}font-size:14.5px;line-height:1.7;color:var(--ink);white-space:pre-line;">${styledCritiqueEN}</div>
        </div>`;
    }

    // Scene / Pacing Beat Breakdown Box
    let beatMapHtml = "";
    if (beatMap.length > 0) {
      const beatTitle = (isCreator ? "⏱️ Algorithmic Pacing & Hook Beats" : "⏱️ Scene Beat Breakdown & Structure") + takeLabel;
      beatMapHtml = `
        <div class="telemetry-card">
          <div class="section-title">${beatTitle}</div>
          <div style="display:flex;flex-direction:column;gap:8px;">`;
      beatMap.forEach((b, bIdx) => {
        beatMapHtml += `
          <div style="background:#fff;padding:10px 12px;border-radius:8px;border:1px solid rgba(28,43,44,0.08);display:flex;gap:12px;align-items:flex-start;">
            <div style="background:#0F172A;color:#38BDF8;font-family:monospace;font-size:11px;font-weight:700;padding:3px 6px;border-radius:5px;white-space:nowrap;">
              ${esc(b.timestamp || ("Beat " + (bIdx + 1)))}
            </div>
            <div style="flex:1;">
              <div style="font-weight:700;font-size:13px;color:var(--ink);">${esc(b.beatTitle || ("Beat #" + (bIdx + 1)))}</div>
              ${b.characterIntent ? `<div style="font-size:12px;color:var(--inkS);margin-top:2px;">${esc(b.characterIntent)}</div>` : ''}
            </div>
          </div>`;
      });
      beatMapHtml += `</div></div>`;
    }

    return dirNotesHtml + critiqueCardHtml + beatMapHtml;
  }

  // 🌐 BILINGUAL CRITIQUE TOGGLE
  window.toggleCritiqueLang = function(lang) {
    const enEl = document.getElementById("critiqueTextEN");
    const locEl = document.getElementById("critiqueTextLocal");
    const btnEn = document.getElementById("btnLangEN");
    const btnLoc = document.getElementById("btnLangLocal");

    if (lang === 'en') {
      if (enEl) enEl.style.display = 'block';
      if (locEl) locEl.style.display = 'none';
      if (btnEn) btnEn.classList.add('active');
      if (btnLoc) btnLoc.classList.remove('active');
    } else {
      if (enEl) enEl.style.display = 'none';
      if (locEl) locEl.style.display = 'block';
      if (btnEn) btnEn.classList.remove('active');
      if (btnLoc) btnLoc.classList.add('active');
    }
  };
  // 🎟️ VIP PASS REDEMPTION & TELEMETRY DISPATCH
  window.wovRedeemVipCode = function() {
    const inputEl = document.getElementById("vipCodeInput");
    const statusEl = document.getElementById("vipCodeStatus");
    if (!inputEl || !statusEl) return;

    const enteredCode = String(inputEl.value || "").trim().toUpperCase();
    const validCodes = ["VENICE-VIP", "DIRECTOR-GUEST", "CLAUDIA-BETA", "SCHOLARSHIP-2026", "TNA-STUDIO"];

    if (validCodes.includes(enteredCode)) {
      statusEl.style.color = "#4ADE80";
      statusEl.innerHTML = "✓ Pass verified. Unlocking studio telemetry archive...";

      const state = window._screenerState || {};
      const talentName = state.rawTalentName || (new URLSearchParams(window.location.search).get("name") || "Unknown Talent");
      const talentKey = talentName.toLowerCase().replace(/[^a-z0-9]/g, "_");

      // Persist authenticated unlock across browser restarts
      try {
        localStorage.setItem("wov_unlocked_" + talentName, "true");
        localStorage.setItem("wov_auth_" + talentKey, btoa(enteredCode + "_VENICE_STUDIO_2026"));
      } catch(e) {}

      // Dispatch real-time Telegram webhook to studio
      try {
        fetch(EXEC, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "vipCodeRedeemed",
            talentName: talentName,
            vipCode: enteredCode,
            timestamp: new Date().toISOString()
          })
        });
      } catch (err) {}

      // Reload into authenticated view
      setTimeout(function() {
        const url = new URL(window.location.href);
        url.searchParams.set("pro", "true");
        window.location.replace(url.toString());
      }, 700);

    } else {
      statusEl.style.color = "#F87171";
      statusEl.innerHTML = "⚠️ Invalid studio key. Contact curation desk.";
    }
  };

// ⏱️ INTERACTIVE TIMECODE CONTROLLER (Smooth-Scrolls & Displays Playhead HUD)
  window.wovSeekTimecode = function(timeStr) {
    if (!timeStr) return;
    
    // Extract first time marker, e.g. "00:19" or "0:19 - 0:25" -> "00:19"
    const match = String(timeStr).match(/\d{1,2}:\d{2}/);
    if (!match) return;
    const cleanTime = match[0];

    // Smooth-scroll player into view
    const videoCard = document.querySelector(".video-card");
    if (videoCard) {
      videoCard.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    // Trigger Playhead HUD Notice over player
    let hud = document.getElementById("playheadHud");
    if (!hud && videoCard) {
      hud = document.createElement("div");
      hud.id = "playheadHud";
      videoCard.appendChild(hud);
    }
    if (hud) {
      hud.innerHTML = `⏱️ Seeking to [${cleanTime}]`;
      hud.style.display = "block";
      hud.style.animation = "none";
      hud.offsetHeight; // force DOM reflow
      hud.style.animation = "fadeInOut 2.5s forwards";
    }

    // If an HTML5 video player is present, seek playhead natively
    const nativeVid = document.getElementById("playerFrame") || document.querySelector("video");
    if (nativeVid && nativeVid.currentTime !== undefined) {
      const parts = cleanTime.split(":");
      const secs = (parseInt(parts[0], 10) * 60) + parseInt(parts[1], 10);
      nativeVid.currentTime = secs;
      nativeVid.play().catch(function(){});
    }
  };
