<!DOCTYPE html>
<!-- Women of Venice — Posa v1.1 · model applications straight to the connector · lives in repo womenofvenice-ops.github.io -->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Posa per Women of Venice</title>
<style>
  :root{ --cream:#F4ECDE; --ink:#1C2B2C; --inkS:#5A6667; --red:#A8492E; --peach:#E09A73; }
  *{ box-sizing:border-box; margin:0; }
  body{ font-family:Georgia,'Times New Roman',serif; background:var(--cream); color:var(--ink); min-height:100vh; }
  .wrap{ max-width:560px; margin:0 auto; padding:26px 16px 60px; }
  h1{ font-size:22px; text-align:center; letter-spacing:.04em; margin-bottom:4px; }
  .sub{ font-family:Arial,sans-serif; font-size:10.5px; text-transform:uppercase; letter-spacing:.26em; color:var(--peach); text-align:center; margin-bottom:8px; }
  .lang{ text-align:center; margin-bottom:18px; }
  .lang button{ font-family:Arial,sans-serif; font-size:12px; padding:6px 14px; border-radius:12px; border:1.5px solid rgba(28,43,44,.3); background:transparent; color:var(--ink); cursor:pointer; }
  .lang button.on{ border-color:var(--red); color:var(--red); font-weight:700; }
  .lbl{ font-family:Arial,sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:.14em; color:var(--inkS); margin:16px 0 6px; }
  input, textarea{ width:100%; padding:13px 15px; border:1.5px solid rgba(28,43,44,.32); border-radius:14px; font-size:16px; font-family:Arial,sans-serif; color:var(--ink); background:#fff; outline:none; }
  textarea{ font-family:Georgia,serif; }
  .pkg{ display:block; border:1.5px solid rgba(28,43,44,.25); border-radius:16px; padding:14px 15px; margin-bottom:10px; cursor:pointer; background:#fff; }
  .pkg input{ width:auto; margin-right:10px; }
  .pkg.on{ border-color:var(--red); box-shadow:0 0 0 1px var(--red); }
  .pkg b{ font-family:Georgia,serif; }
  .pkg .d{ font-family:Arial,sans-serif; font-size:12.5px; color:var(--inkS); margin-top:3px; }
  .btn{ display:block; width:100%; margin-top:24px; padding:16px; border:none; border-radius:18px;
    font-family:Arial,sans-serif; font-size:16px; font-weight:700; color:var(--ink); cursor:pointer;
    background:linear-gradient(135deg,#F6CDAB 0%,#EFB98F 45%,#E09A73 100%); box-shadow:inset 0 1px 0 rgba(255,255,255,.45); }
  .done{ text-align:center; padding:60px 20px; }
  .done .big{ font-size:44px; margin-bottom:14px; }
  .motto{ font-style:italic; text-align:center; color:var(--red); margin-top:26px; font-size:14.5px; }
  .note{ font-family:Arial,sans-serif; font-size:12.5px; color:var(--inkS); text-align:center; margin-top:10px; line-height:1.5; }
</style>
</head>
<body>
<div class="wrap"><a href="index.html" style="font-family:Arial,sans-serif;font-size:13px;color:var(--red);text-decoration:none;font-weight:600">← Women of Venice</a></div>
<div class="wrap" id="app" style="padding-top:0"></div>
<script>
(function(){
  var EXEC = "https://script.google.com/macros/s/AKfycbw1sia4uM2Xfc3_xP4umiZAPC77_XAyS4R86_oRgV1HHfM1CNRdRCG31SuCqJwFMc8/exec";
  var Q = new URLSearchParams(location.search);
  var lang = (Q.get("lang")==="en")?"en":( (navigator.language||"").indexOf("it")===0 ? "it" : "en" );
  var T = {
    it:{ t:"Posa per Women of Venice", h:"Ritratti e storie di donne, a Venezia. La sessione \u00e8 un regalo: le foto sono tue, e sei tu a decidere cosa autorizzare. Raccontami chi sei \u2014 ti scrivo io.",
      n:"Nome", e:"Email", p:"Telefono / WhatsApp (opzionale)", ig:"Instagram (opzionale)", c:"Citt\u00e0",
      a:"Quando saresti disponibile? (es. weekend, sere d'estate...)", m:"Due righe su di te \u2014 e perch\u00e9 ti va (opzionale)",
      send:"Invia la candidatura \u2192", req:"Servono almeno nome, email e citt\u00e0.",
      ty:"Candidatura inviata!", ty2:"Ti scrivo personalmente entro un paio di giorni. A prestissimo \u2728",
      note:"Consenso sempre prima di tutto: niente si pubblica senza il tuo s\u00ec scritto." },
    en:{ t:"Pose for Women of Venice", h:"Portraits and stories of women, in Venice. The session is a gift: the photos are yours, and you decide what to authorize. Tell me about yourself \u2014 I'll write you back.",
      n:"Name", e:"Email", p:"Phone / WhatsApp (optional)", ig:"Instagram (optional)", c:"City",
      a:"When would you be available? (e.g. weekends, summer evenings...)", m:"A couple of lines about you \u2014 and why you'd like to (optional)",
      send:"Send my application \u2192", req:"Name, email and city are needed.",
      ty:"Application sent!", ty2:"I'll write you personally within a couple of days. See you very soon \u2728",
      note:"Consent always comes first: nothing is published without your written yes." }
  };
  var app = document.getElementById("app");
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function render(){
    var L = T[lang];
    app.innerHTML =
      '<h1>'+L.t+'</h1><div class="sub">Women of Venice \u00b7 Portraits &amp; stories</div>'+
      '<div class="lang"><button id="l-it" class="'+(lang==="it"?"on":"")+'">Italiano</button> <button id="l-en" class="'+(lang==="en"?"on":"")+'">English</button></div>'+
      '<div class="note" style="margin-bottom:6px">'+L.h+'</div>'+
      '<div class="lbl">'+L.n+' *</div><input id="p-n" type="text">'+
      '<div class="lbl">'+L.e+' *</div><input id="p-e" type="email">'+
      '<div class="lbl">'+L.p+'</div><input id="p-p" type="tel">'+
      '<div class="lbl">'+L.ig+'</div><input id="p-ig" type="text" placeholder="@">'+
      '<div class="lbl">'+L.c+' *</div><input id="p-c" type="text">'+
      '<div class="lbl">'+L.a+'</div><input id="p-a" type="text">'+
      '<div class="lbl">'+L.m+'</div><textarea id="p-m" rows="3"></textarea>'+
      '<button class="btn" id="p-send">'+L.send+'</button>'+
      '<div class="note">'+L.note+'</div>'+
      '<div class="motto">\u2726 I\u2019ll steal you from Chronos \u2014 and give you Kairos.</div>';
    document.getElementById("l-it").onclick=function(){ lang="it"; render(); };
    document.getElementById("l-en").onclick=function(){ lang="en"; render(); };
    document.getElementById("p-send").onclick=function(){
      var L2=T[lang];
      var gv=function(id){ var el=document.getElementById(id); return el?el.value.trim():""; };
      var rec={ action:"casting", record:{ name:gv("p-n"), email:gv("p-e"), phone:gv("p-p"), ig:gv("p-ig"),
        city:gv("p-c"), avail:gv("p-a"), msg:gv("p-m"), lang:lang } };
      if(!rec.record.name || !rec.record.email || !rec.record.city){ alert(L2.req); return; }
      fetch(EXEC, { method:"POST", mode:"no-cors",
        headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(rec) });
      app.innerHTML='<div class="done"><div class="big">\ud83c\udfad</div><h1>'+L2.ty+'</h1>'+
        '<div class="note" style="margin-top:10px">'+L2.ty2+'</div>'+
        '<div class="motto">\u2726 I\u2019ll steal you from Chronos \u2014 and give you Kairos.</div></div>';
    };
  }
  render();
})();
</script>
</body>
</html>
