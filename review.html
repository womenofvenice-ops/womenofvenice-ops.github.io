<!DOCTYPE html>
<!-- WoV Stories & Director Dossier Review v3.2 (Multi-Take Progression & Talent Feedback) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WoV Talent & Stories</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ 
    --cream:#F4ECDE; --ink:#1C2B2C; --inkS:#5A6667; 
    --red:#A8492E; --peach:#E09A73; --gold:#C7A463; 
    --cardBg:#FFFFFF; --boxBg:#F9F6F0;
  }
  *{ box-sizing:border-box; margin:0; }
  body{ font-family:'Inter',Arial,sans-serif; background:var(--cream); color:var(--ink); min-height:100vh; padding:20px 16px 50px; }
  h1{ font-family:'Playfair Display',Georgia,serif; font-size:24px; text-align:center; margin-bottom:16px; }
  .list{ display:flex; flex-direction:column; gap:12px; }
  .card{ background:var(--cardBg); border-radius:16px; padding:16px; box-shadow:0 2px 10px rgba(28,43,44,.06); cursor:pointer; transition:transform .15s ease; }
  .card:active{ transform:scale(.98); }
  .card .name{ font-weight:700; font-size:17px; }
  .card .archetype-tag{ display:inline-block; font-size:11px; font-weight:600; color:var(--red); background:#FDF2EE; padding:2px 8px; border-radius:6px; margin-top:4px; }
  .card .meta{ font-size:12px; color:var(--inkS); margin-top:4px; }
  .badge{ display:inline-block; font-size:11px; font-weight:700; padding:3px 10px; border-radius:99px; margin-top:6px; }
  .b-await{ background:#F3E3C4; color:#7A5A1E; }
  .b-approved{ background:#CFE3CF; color:#2E5B2E; }
  .b-edit{ background:#F0D0C8; color:#8A3A28; }
  .back{ display:inline-block; margin-bottom:14px; color:var(--red); font-weight:700; font-size:14px; cursor:pointer; }
  .section-lbl{ font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--peach); font-weight:700; margin:18px 0 8px; }
  
  /* DIRECTOR DOSSIER STYLING */
  .dossier-box{ background:#fff; border-radius:14px; padding:16px; border:1px solid rgba(28,43,44,.1); margin-bottom:14px; }
  .d-row{ margin-bottom:10px; font-size:13.5px; line-height:1.5; }
  .d-row:last-child{ margin-bottom:0; }
  .d-title{ font-weight:700; color:var(--ink); font-size:12px; text-transform:uppercase; letter-spacing:.05em; margin-bottom:2px; }
  .d-coach{ background:#FFFBF5; border-left:3.5px solid var(--gold); }
  .d-hook{ background:#FDF7F4; border-left:3.5px solid var(--red); }
  .d-feedback{ background:#F0FDF4; border-left:3.5px solid #22C55E; }
  .d-progression{ background:#EFF6FF; border-left:3.5px solid #3B82F6; }
  .soundbite-pill{ font-family:'Playfair Display',Georgia,serif; font-style:italic; font-size:15px; color:var(--red); margin-top:4px; }

  .transcript{ background:#fff; border-radius:14px; padding:14px; font-size:14.5px; line-height:1.6; color:var(--inkS); white-space:pre-line; border:1px solid rgba(28,43,44,.08); }
  textarea{ width:100%; min-height:160px; border:1.5px solid rgba(28,43,44,.2); border-radius:14px; padding:14px; font-family:'Inter',Arial,sans-serif; font-size:15px; line-height:1.6; }
  .toolrow{ display:flex; gap:8px; margin-top:8px; align-items:center; flex-wrap:wrap; }
  .charcount{ font-size:12px; color:var(--inkS); margin-left:auto; }
  .btnrow{ display:flex; gap:10px; margin-top:16px; }
  button{ padding:12px 16px; border-radius:30px; border:none; font-weight:700; font-size:14px; cursor:pointer; }
  .approve{ background:var(--red); color:#fff; flex:1; padding:14px; font-size:15px; }
  .edit{ background:#fff; color:var(--red); border:2px solid var(--red); flex:1; padding:14px; font-size:15px; }
  .small{ background:#fff; color:var(--ink); border:1.5px solid rgba(28,43,44,.2); font-size:12px; padding:8px 12px; }
  .danger{ background:#fff; color:#B3261E; border:1.5px solid #B3261E; margin-top:20px; width:100%; padding:12px; }
  .status{ text-align:center; margin-top:14px; font-size:14px; color:var(--inkS); }
  .filterrow{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; justify-content:center; }
  .filterrow button{ padding:8px 14px; font-size:12px; background:#fff; color:var(--ink); border:1.5px solid rgba(28,43,44,.2); }
  .filterrow button.on{ background:var(--ink); color:#fff; border-color:var(--ink); }

  /* UNLOCK BOX */
  .auth-box{ background:#fff; max-width:340px; margin:40px auto; padding:24px; border-radius:16px; box-shadow:0 4px 15px rgba(28,43,44,.08); text-align:center; }
  .auth-box input{ width:100%; padding:12px; border:1.5px solid rgba(28,43,44,.2); border-radius:10px; font-size:14px; margin:14px 0; outline:none; }
  .auth-box button{ width:100%; background:var(--red); color:#fff; padding:12px; border-radius:10px; font-size:14px; }
</style>
</head>
<body>
  <h1>✦ WoV Talent & Stories</h1>
  <div id="app">Loading…</div>

<script>
(function(){
  var EXEC = "https://script.google.com/macros/s/AKfycbw1sia4uM2Xfc3_xP4umiZAPC77_XAyS4R86_oRgV1HHfM1CNRdRCG31SuCqJwFMc8/exec";
  var ACTIVE_TALENT = localStorage.getItem("wov_active_talent") || null;
  // 1. ROBUST KEY ACQUISITION (URL param takes precedence, persists to localStorage)
  var rawUrlKey = new URLSearchParams(window.location.search).get("key") || "";
  var KEY = (rawUrlKey || localStorage.getItem("wov_review_key") || "").trim().replace(/^["']|["']$/g, "");
  
  if (rawUrlKey) {
    localStorage.setItem("wov_review_key", KEY);
  }

  var app = document.getElementById("app");
  var items = [];
  var filter = "await";
  var searchQuery = "";

  function esc(s){ return String(s||"").replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function badgeClass(s){ s=(s||"").toLowerCase(); if(s.indexOf("approved")>=0) return "b-approved"; if(s.indexOf("edit")>=0) return "b-edit"; return "b-await"; }

  function renderUnlock(){
    app.innerHTML = 
      '<div class="auth-box">' +
        '<div style="font-weight:700;font-size:16px;margin-bottom:6px">Director Authentication</div>' +
        '<div style="font-size:12.5px;color:var(--inkS)">Enter private access key to unlock talent dossiers.</div>' +
        '<input type="password" id="keyInput" placeholder="Private Access Key">' +
        '<button onclick="wovUnlock()">Unlock Dashboard</button>' +
        '<div id="authErr" style="color:var(--red);font-size:12px;margin-top:10px"></div>' +
      '</div>';
  }

  window.wovUnlock = function(){
    var input = document.getElementById("keyInput");
    var val = input ? input.value.trim().replace(/^["']|["']$/g, "") : "";
    if(!val){ return; }
    KEY = val;
    localStorage.setItem("wov_review_key", KEY);
    app.innerHTML = "Authenticating…";
    loadAll();
  };

  function renderList(){
    if(!KEY){ renderUnlock(); return; }

    // Render search and filter buttons ONCE so typing never closes the mobile keyboard:
    var topBarEl = document.getElementById("topBar");
    if(!topBarEl){
      app.innerHTML = 
        '<div id="topBar">' + filterButtons() +
        '<input type="text" id="searchbox" placeholder="Search talent by name…" value="' + esc(searchQuery) + '" ' +
        'oninput="wovSearch(this.value)" style="width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid rgba(28,43,44,.2);font-size:15px;margin-bottom:14px;">' +
        '</div>' +
        '<div id="listContainer"></div>';
    }

    var filtered = items.filter(function(it){
      var s = (it.status||"").toLowerCase();
      var statusOk = filter==="all" ? true : (filter==="approved" ? s.indexOf("approved")>=0 : s.indexOf("approved")<0);
      var searchOk = !searchQuery || (it.name||"").toLowerCase().indexOf(searchQuery.toLowerCase())>=0;
      return statusOk && searchOk;
    });

    var listEl = document.getElementById("listContainer");
    if(!listEl) return;

    if(!filtered.length){ 
      listEl.innerHTML = "<div class='status'>No profiles found.</div>"; 
      return; 
    }
    
    var html = '<div class="list">';
    filtered.forEach(function(it){
      var realIdx = items.indexOf(it);
      var d = it.date ? new Date(it.date).toLocaleDateString() : "";
      
      var dos = it.dossier || {};
      if (typeof dos === "string") { try { dos = JSON.parse(dos); } catch(e){ dos = {}; } }
      var arch = (dos.castingDossier && dos.castingDossier.marketArchetype) ? dos.castingDossier.marketArchetype : "";
      
      html += '<div class="card" onclick="wovOpen('+realIdx+')">' +
        '<div class="name">'+esc(it.name||"?")+'</div>' +
        (arch ? '<span class="archetype-tag">🎭 '+esc(arch)+'</span>' : '') +
        '<div class="meta">'+d+'</div>' +
        '<span class="badge '+badgeClass(it.status)+'">'+esc(it.status||"Awaiting review")+'</span>' +
        '</div>';
    });
    html += '</div>';
    listEl.innerHTML = html;
  }

  function filterButtons(){
    return '<div class="filterrow">' +
      '<button class="'+(filter==="await"?"on":"")+'" onclick="wovFilter(\'await\')">Needs review</button>' +
      '<button class="'+(filter==="approved"?"on":"")+'" onclick="wovFilter(\'approved\')">Approved</button>' +
      '<button class="'+(filter==="all"?"on":"")+'" onclick="wovFilter(\'all\')">All</button>' +
      '</div>';
  }
  window.wovFilter = function(f){ filter=f; renderList(); };
  window.wovSearch = function(v){ searchQuery=v; renderList(); };

  function updateCharCount(){
    var box=document.getElementById("storybox");
    var cc=document.getElementById("charcount");
    if(box && cc) cc.textContent = box.value.length + " chars";
  }

  window.wovOpen = function(idx){
    var it = items[idx];
    var d = it.date ? new Date(it.date).toLocaleString() : "";
    var dos = it.dossier || {};
    if (typeof dos === "string") { try { dos = JSON.parse(dos); } catch(e){ dos = {}; } }

    var cast = dos.castingDossier || {};
    var dir = dos.directorNotes || {};
    var strat = dos.contentStrategy || {};

    // 1. CASTING PROFILE & PRIVATE COACHING
    var dossierHtml = "";
    if(dos.castingDossier){
      dossierHtml = 
        '<div class="section-lbl">🎭 Casting Profile & Screen Persona</div>' +
        '<div class="dossier-box">' +
          '<div class="d-row"><div class="d-title">Market Archetype</div><b>'+esc(cast.marketArchetype||"-")+'</b></div>' +
          '<div class="d-row"><div class="d-title">Casting Suitability</div>'+esc(cast.castingFit||"-")+'</div>' +
          '<div class="d-row"><div class="d-title">Screen Presence</div>'+esc(cast.screenPresence||"-")+'</div>' +
        '</div>' +
        
        '<div class="section-lbl">🎬 Director\'s Private Coaching (For Claudio)</div>' +
        '<div class="dossier-box d-coach">' +
          '<div class="d-row"><div class="d-title">⚡ Her Natural Superpower</div>'+esc(dir.superpower||"-")+'</div>' +
          '<div class="d-row"><div class="d-title">⚠️ Blindspot to Correct</div>'+esc(dir.blindspotToCorrect||"-")+'</div>' +
          '<div class="d-row"><div class="d-title">🎯 Next Session Directive</div><b>'+esc(dir.nextSessionDirective||"-")+'</b></div>' +
          '<div class="d-row"><div class="d-title">🎙️ Vocal Delivery Analysis</div>'+esc(dir.vocalDelivery||"-")+'</div>' +
        '</div>';
    }

    // 2. MULTI-TAKE PROGRESSION (FOR TAKE 2+)
    var progressionHtml = "";
    if(dos.progressionAnalysis && it.name.indexOf("Take 1") < 0){
      progressionHtml = 
        '<div class="section-lbl">📈 Multi-Take Progression Analysis</div>' +
        '<div class="dossier-box d-progression">' +
          '<div class="d-row"><div class="d-title">Take-Over-Take Evolution</div>'+esc(dos.progressionAnalysis)+'</div>' +
        '</div>';
    }

    // 3. CONSTRUCTIVE TALENT FEEDBACK (READY TO SHARE WITH ACTRESS)
    var feedbackHtml = "";
    if(dos.talentFeedback){
      feedbackHtml = 
        '<div class="section-lbl">💌 Positive Constructive Critique (For Actress)</div>' +
        '<div class="dossier-box d-feedback">' +
          '<div style="font-size:14px;line-height:1.6;color:#1C2B2C;margin-bottom:12px">'+esc(dos.talentFeedback)+'</div>' +
          '<button class="small" onclick="wovCopyFeedback('+idx+')">📋 Copy Feedback to Send Her</button>' +
        '</div>';
    }

    // 4. AUDIENCE HOOK & SIGNATURE SOUNDBITE
    var hookHtml = "";
    if(strat.viralHook || strat.signatureSoundbite){
      hookHtml = 
        '<div class="section-lbl">🔥 Audience Hook & Soundbite</div>' +
        '<div class="dossier-box d-hook">' +
          '<div class="d-row"><div class="d-title">Viral Hook (Opening Line for Reel)</div>"'+esc(strat.viralHook||"-")+'"</div>' +
          '<div class="d-row"><div class="d-title">Verbatim Signature Soundbite</div><div class="soundbite-pill">“'+esc(strat.signatureSoundbite||"-")+'”</div></div>' +
        '</div>';
    }

    // 5. SMART CLOUD SESSION STATUS (GREEN CARD IF ACTIVE, BLUE BUTTON IF INACTIVE)
    var cleanName = (it.name || "Talent").replace(/\s*\(Take\s*\d+\)/i, "").trim();
    var activeTalentName = (typeof ACTIVE_TALENT !== "undefined" && ACTIVE_TALENT) ? ACTIVE_TALENT : (localStorage.getItem("wov_active_talent") || "");
    var isActive = activeTalentName && (
      activeTalentName.toLowerCase() === cleanName.toLowerCase() ||
      cleanName.toLowerCase().indexOf(activeTalentName.toLowerCase()) >= 0 ||
      activeTalentName.toLowerCase().indexOf(cleanName.toLowerCase()) >= 0
    );

    var sessionStatusHtml = "";
    if (isActive) {
      sessionStatusHtml = 
        '<div style="background:#F0FDF4;border:1.5px solid #22C55E;border-radius:12px;padding:14px;text-align:center;margin:12px 0 16px;">' +
          '<div style="color:#166534;font-weight:700;font-size:15px;">🟢 SESSION ACTIVE IN CLOUD</div>' +
          '<div style="color:#15803D;font-size:12.5px;margin-top:4px;">Ready for next take in Open Camera. Tap Camera Widget to offload.</div>' +
        '</div>';
    } else {
      sessionStatusHtml = 
        '<div style="margin:12px 0 16px;">' +
          '<button id="activateBtn" style="width:100%;background:#1F6FEB;color:#fff;padding:12px;border-radius:12px;font-size:14px;font-weight:700;" onclick="wovActivateCallback('+idx+')">' +
            '🎬 Activate Session for ' + esc(cleanName) +
          '</button>' +
        '</div>';
    }

    // 6. TALENT CONTACTS & INTAKE PROFILE CARD
    var contactHtml = "";
    if (it.targetFormat || it.instagram || it.phone || it.email || it.intakeNotes) {
      contactHtml = 
        '<div class="section-lbl">📱 Talent Contact & Intake Profile</div>' +
        '<div class="dossier-box" style="background:#fff;border-left:3.5px solid #58A6FF;">' +
          (it.targetFormat ? '<div class="d-row"><div class="d-title">🎯 Target Ambition</div><b>'+esc(it.targetFormat)+'</b></div>' : '') +
          (it.instagram ? '<div class="d-row"><div class="d-title">📸 Instagram / Portfolio</div><a href="https://instagram.com/'+esc(it.instagram).replace('@','')+'" target="_blank" style="color:#58A6FF;text-decoration:none;font-weight:600;">'+esc(it.instagram)+'</a></div>' : '') +
          (it.phone ? '<div class="d-row"><div class="d-title">📞 Phone / WhatsApp</div><a href="tel:'+esc(it.phone)+'" style="color:#1C2B2C;text-decoration:none;font-weight:600;">'+esc(it.phone)+'</a></div>' : '') +
          (it.email ? '<div class="d-row"><div class="d-title">✉️ Email Address</div><a href="mailto:'+esc(it.email)+'" style="color:#1C2B2C;text-decoration:none;">'+esc(it.email)+'</a></div>' : '') +
          (it.intakeNotes ? '<div class="d-row"><div class="d-title">📝 Intake Directing Notes</div>'+esc(it.intakeNotes)+'</div>' : '') +
        '</div>';
    }

    // 7. HANDLE TALENT AWAITING FIRST TAKE (E.G. VALERIA IS)
    var isAwaitingFirstVideo = it.isNewIntake || (!it.sourceFileId && !it.dossier);
    var bodyContentHtml = "";

    if (isAwaitingFirstVideo) {
      bodyContentHtml = 
        '<div class="dossier-box" style="background:#FFFBF5;border-left:3.5px solid #C7A463;margin-top:14px;">' +
          '<div style="font-weight:700;font-size:14px;color:#7A5A1E;margin-bottom:4px;">⏳ Awaiting First Audition Scene</div>' +
          '<div style="font-size:13px;color:#5A6667;line-height:1.5;">Legal consent waiver signed on file. Ready to record Take #1 in Open Camera!</div>' +
        '</div>' +
        '<button class="danger" id="delbtn" onclick="wovDeleteTap('+idx+')">🗑 Delete this profile</button>' +
        '<div class="status" id="savemsg"></div>';
    } else {
      bodyContentHtml = 
        dossierHtml +
        progressionHtml +
        feedbackHtml +
        hookHtml +
        '<div class="section-lbl">Portfolio Story Narrative (Editable)</div>' +
        '<textarea id="storybox" oninput="updateCC()">'+esc(it.draft||"")+'</textarea>' +
        '<div class="toolrow">' +
          '<button class="small" onclick="wovCopy()">📋 Copy Story</button>' +
          '<button class="small" onclick="wovReset('+idx+')">↺ Reset</button>' +
          '<span class="charcount" id="charcount"></span>' +
        '</div>' +
        '<div class="section-lbl">Verbatim Transcript (Her real words)</div>' +
        '<div class="transcript">'+esc(it.transcript||"(none captured)")+'</div>' +
        '<div class="btnrow">' +
          '<button class="edit" id="editbtn" onclick="wovSave('+idx+',\'✏️ Needs edit\')">Needs work</button>' +
          '<button class="approve" id="approvebtn" onclick="wovSave('+idx+',\'✅ Approved\')">Approve</button>' +
        '</div>' +
        '<button class="danger" id="delbtn" onclick="wovDeleteTap('+idx+')">🗑 Delete this profile</button>' +
        '<div class="status" id="savemsg"></div>';
    }

    app.innerHTML =
      '<a class="back" onclick="wovBack()">← Back to Talent Roster</a>' +
      '<h1 style="text-align:left;font-size:22px">'+esc(it.name||"?")+'</h1>' +
      '<div class="meta" style="margin-bottom:8px">'+esc(d)+(it.sourceFileName?' · '+esc(it.sourceFileName):'')+'</div>' +
      (it.sourceFileId?'<button class="small" id="playbtn" onclick="wovPlayAudio(\''+it.sourceFileId+'\')">🔊 Play recording</button><div id="audiobox" style="margin:10px 0"></div>':'') +
      '<div><span class="badge '+badgeClass(it.status)+'">'+esc(it.status||"Awaiting review")+'</span></div>' +
      
      sessionStatusHtml +
      contactHtml +
      bodyContentHtml;
      
    if (document.getElementById("storybox")) {
      updateCharCount();
    }
  };

  // Dedicated Crash-Proof Feedback Copier
  window.wovCopyFeedback = function(idx){
    var it = items[idx];
    var dos = it.dossier || {};
    if (typeof dos === "string") { try { dos = JSON.parse(dos); } catch(e){ dos = {}; } }
    var text = dos.talentFeedback || "";
    if(!text){ alert("No feedback text available."); return; }
    
    navigator.clipboard.writeText(text).then(function(){
      var msg = document.getElementById("savemsg");
      if(msg) msg.textContent = "Feedback copied to clipboard ✓";
      alert("✓ Constructive critique copied! Ready to text or email to the actress.");
    }).catch(function(){
      prompt("Copy critique below:", text);
    });
  };

  // Dedicated Callback Session Activator
  window.wovActivateCallback = async function(idx){
    var it = items[idx];
    var dos = it.dossier || {};
    if (typeof dos === "string") { try { dos = JSON.parse(dos); } catch(e){ dos = {}; } }

    var cleanName = (it.name || "Talent").replace(/\s*\(Take\s*\d+\)/i, "").trim();
    var currentTakeNum = dos.takeNumber || 1;
    var lastAdj = (dos.directorNotes && dos.directorNotes.nextSessionDirective) ? dos.directorNotes.nextSessionDirective : "";
    var castFit = (dos.castingDossier && dos.castingDossier.castingFit) ? dos.castingDossier.castingFit : "";

    var btn = document.getElementById("activateBtn");
    if(btn){
      btn.disabled = true;
      btn.textContent = "Activating Callback in Cloud…";
    }

    try {
      await fetch(EXEC, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "activateCallback",
          key: KEY,
          name: cleanName,
          targetFormat: castFit,
          takeCount: currentTakeNum,
          lastAdjustment: lastAdj
        })
      });

      if(btn){
        btn.textContent = "✓ Callback Session ACTIVE for " + cleanName + "!";
        btn.style.background = "#238636"; // Turns solid green!
      }
      ACTIVE_TALENT = cleanName;
      localStorage.setItem("wov_active_talent", cleanName);
      setTimeout(function(){ wovOpen(idx); }, 800); // Refreshes to show the permanent green card!
      var msg = document.getElementById("savemsg");
      if(msg) msg.textContent = "Session active! Shoot in Open Camera and tap your Camera Widget.";
    } catch(err) {
      if(btn){
        btn.disabled = false;
        btn.textContent = "⚠️ Error activating: " + err;
        btn.style.background = "#B3261E";
      }
    }
  };

  var deleteArmed = null, deleteTimer = null;
  window.wovDeleteTap = function(idx){
    var btn = document.getElementById("delbtn");
    if(deleteArmed === idx){
      clearTimeout(deleteTimer); deleteArmed = null;
      wovDelete(idx);
      return;
    }
    deleteArmed = idx;
    btn.textContent = "⚠️ Tap again to permanently delete";
    btn.style.background = "#B3261E"; btn.style.color = "#fff";
    deleteTimer = setTimeout(function(){
      deleteArmed = null;
      btn.textContent = "🗑 Delete this profile";
      btn.style.background = "#fff"; btn.style.color = "#B3261E";
    }, 4000);
  };

  window.updateCC = updateCharCount;
  window.wovBack = function(){ 
    document.getElementById("app").innerHTML = ""; 
    renderList(); 
  };
  window.wovPlayAudio = async function(fileId){
    var btn = document.getElementById("playbtn");
    var box = document.getElementById("audiobox");
    btn.disabled = true; btn.textContent = "Loading…";
    try{
      var r = await fetch(EXEC + "?action=audioFile&id=" + encodeURIComponent(fileId) + "&key=" + encodeURIComponent(KEY));
      var data = await r.json();
      if(data.error){ box.textContent = "⚠️ " + data.error; btn.disabled=false; btn.textContent="🔊 Play recording"; return; }
      var byteChars = atob(data.audio);
      var byteArr = new Uint8Array(byteChars.length);
      for(var i=0;i<byteChars.length;i++) byteArr[i] = byteChars.charCodeAt(i);
      var blob = new Blob([byteArr], { type: data.mime || "audio/mp4" });
      var url = URL.createObjectURL(blob);
      box.innerHTML = '<audio controls autoplay src="'+url+'" style="width:100%"></audio>';
      btn.style.display = "none";
    }catch(err){ box.textContent = "⚠️ " + err; btn.disabled=false; btn.textContent="🔊 Play recording"; }
  };

  window.wovReset = function(idx){
    document.getElementById("storybox").value = items[idx].draft || "";
    updateCharCount();
  };

  window.wovCopy = async function(){
    var box = document.getElementById("storybox");
    try{ await navigator.clipboard.writeText(box.value); }
    catch(e){ box.select(); try{ document.execCommand("copy"); }catch(e2){} }
    var msg=document.getElementById("savemsg"); if(msg) msg.textContent="Copied ✓";
  };

  window.wovSave = async function(idx, status){
    var it = items[idx];
    var text = document.getElementById("storybox").value;
    var eb=document.getElementById("editbtn"), ab=document.getElementById("approvebtn");
    if(eb) eb.disabled=true; if(ab) ab.disabled=true;
    document.getElementById("savemsg").textContent = "Saving…";
    try{
      await fetch(EXEC, { method:"POST", mode:"no-cors",
        headers:{ "Content-Type":"text/plain;charset=utf-8" },
        body: JSON.stringify({ action:"storyUpdate", key:KEY, rowId:it.rowId, finalStory:text, status:status }) });
      it.draft = text; it.status = status;
      document.getElementById("savemsg").textContent = "✓ Saved";
      setTimeout(function(){ renderList(); }, 700);
    }catch(err){
      document.getElementById("savemsg").textContent = "⚠️ " + err;
    }
  };

  window.wovDelete = async function(idx){
    var it = items[idx];
    document.getElementById("savemsg").textContent = "Deleting…";
    try{
      await fetch(EXEC, { method:"POST", mode:"no-cors",
        headers:{ "Content-Type":"text/plain;charset=utf-8" },
        body: JSON.stringify({ action:"storyDelete", key:KEY, rowId:it.rowId }) });
      loadAll();
    }catch(err){
      document.getElementById("savemsg").textContent = "⚠️ " + err;
    }
  };

  function loadAll(){
    if(!KEY){ renderUnlock(); return; }
    // Cache-busting parameter &_t guarantees real-time fresh updates
    fetch(EXEC + "?action=storiesList&key=" + encodeURIComponent(KEY) + "&_t=" + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(data){ 
        if(data && data.error){
          app.innerHTML = '<div class="auth-box"><div style="color:var(--red);font-weight:700;margin-bottom:8px">⚠️ ' + esc(data.error) + '</div><button onclick="localStorage.removeItem(\'wov_review_key\');location.reload();">Re-enter Key</button></div>';
          return;
        }
        items = (data && data.items) || []; 
        if(data && data.activeCandidate){
          ACTIVE_TALENT = data.activeCandidate;
          localStorage.setItem("wov_active_talent", ACTIVE_TALENT);
        }
        renderList(); 
      })
      .catch(function(e){ 
        app.innerHTML = "<div class='status'>Could not load: "+e+"</div>"; 
      });
  }

  loadAll();
})();
</script>
</body>
</html>
