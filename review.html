<!DOCTYPE html>
<!-- WoV Stories Review v2 — private link, delete, copy/reset/char-count -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WoV Stories</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --cream:#F4ECDE; --ink:#1C2B2C; --inkS:#5A6667; --red:#A8492E; --peach:#E09A73; --gold:#C7A463; }
  *{ box-sizing:border-box; margin:0; }
  body{ font-family:'Inter',Arial,sans-serif; background:var(--cream); color:var(--ink); min-height:100vh; padding:20px 16px 40px; }
  h1{ font-family:'Playfair Display',Georgia,serif; font-size:22px; text-align:center; margin-bottom:16px; }
  .list{ display:flex; flex-direction:column; gap:10px; }
  .card{ background:#fff; border-radius:16px; padding:14px 16px; box-shadow:0 2px 8px rgba(28,43,44,.08); cursor:pointer; }
  .card .name{ font-weight:700; font-size:16px; }
  .card .meta{ font-size:12px; color:var(--inkS); margin-top:2px; }
  .badge{ display:inline-block; font-size:11px; font-weight:700; padding:3px 10px; border-radius:99px; margin-top:6px; }
  .b-await{ background:#F3E3C4; color:#7A5A1E; }
  .b-approved{ background:#CFE3CF; color:#2E5B2E; }
  .b-edit{ background:#F0D0C8; color:#8A3A28; }
  .back{ display:inline-block; margin-bottom:14px; color:var(--red); font-weight:700; font-size:14px; cursor:pointer; }
  .section-lbl{ font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--peach); font-weight:700; margin:16px 0 8px; }
  .transcript{ background:#fff; border-radius:14px; padding:14px; font-size:14.5px; line-height:1.6; color:var(--inkS); white-space:pre-line; }
  textarea{ width:100%; min-height:180px; border:1.5px solid rgba(28,43,44,.2); border-radius:14px; padding:14px; font-family:'Inter',Arial,sans-serif; font-size:15px; line-height:1.6; }
  .toolrow{ display:flex; gap:8px; margin-top:8px; align-items:center; flex-wrap:wrap; }
  .charcount{ font-size:12px; color:var(--inkS); margin-left:auto; }
  .btnrow{ display:flex; gap:10px; margin-top:14px; }
  button{ padding:12px 16px; border-radius:30px; border:none; font-weight:700; font-size:14px; cursor:pointer; }
  .approve{ background:var(--red); color:#fff; flex:1; padding:14px; font-size:15px; }
  .edit{ background:#fff; color:var(--red); border:2px solid var(--red); flex:1; padding:14px; font-size:15px; }
  .small{ background:#fff; color:var(--ink); border:1.5px solid rgba(28,43,44,.2); font-size:12px; padding:8px 12px; }
  .danger{ background:#fff; color:#B3261E; border:1.5px solid #B3261E; margin-top:16px; width:100%; padding:12px; }
  .status{ text-align:center; margin-top:14px; font-size:14px; color:var(--inkS); }
  .filterrow{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; justify-content:center; }
  .filterrow button{ padding:8px 14px; font-size:12px; background:#fff; color:var(--ink); border:1.5px solid rgba(28,43,44,.2); }
  .filterrow button.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
</style>
</head>
<body>
  <h1>✦ WoV Stories</h1>
  <div id="app">Loading…</div>

<script>
(function(){
  var EXEC = "https://script.google.com/macros/s/AKfycbw1sia4uM2Xfc3_xP4umiZAPC77_XAyS4R86_oRgV1HHfM1CNRdRCG31SuCqJwFMc8/exec";
  var KEY = new URLSearchParams(window.location.search).get("key") || "";
  var app = document.getElementById("app");
  var items = [];
  var filter = "await";

  function esc(s){ return String(s||"").replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function badgeClass(s){ s=(s||"").toLowerCase(); if(s.indexOf("approved")>=0) return "b-approved"; if(s.indexOf("edit")>=0) return "b-edit"; return "b-await"; }

    var searchQuery = "";

  function renderList(){
    if(!KEY){ app.innerHTML = "<div class='status'>Private link required.</div>"; return; }
    var filtered = items.filter(function(it){
      var s = (it.status||"").toLowerCase();
      var statusOk = filter==="all" ? true : (filter==="approved" ? s.indexOf("approved")>=0 : s.indexOf("approved")<0);
      var searchOk = !searchQuery || (it.name||"").toLowerCase().indexOf(searchQuery.toLowerCase())>=0;
      return statusOk && searchOk;
    });
    var topBar = filterButtons() +
      '<input type="text" id="searchbox" placeholder="Search by name\u2026" value="'+esc(searchQuery)+'" ' +
      'onchange="wovSearch(this.value)" style="width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid rgba(28,43,44,.2);font-size:15px;margin-bottom:14px;box-sizing:border-box">';
    if(!filtered.length){ app.innerHTML = topBar + "<div class='status'>Nothing here.</div>"; return; }
    var html = topBar + '<div class="list">';
    filtered.forEach(function(it){
      var realIdx = items.indexOf(it);
      var d = it.date ? new Date(it.date).toLocaleString() : "";
      html += '<div class="card" onclick="wovOpen('+realIdx+')">' +
        '<div class="name">'+esc(it.name||"?")+'</div>' +
        '<div class="meta">'+d+'</div>' +
        '<span class="badge '+badgeClass(it.status)+'">'+esc(it.status||"Awaiting review")+'</span>' +
        '</div>';
    });
    html += '</div>';
    app.innerHTML = html;
  }

    function filterButtons(){
    return '<div class="filterrow">' +
      '<button class="'+(filter==="await"?"on":"")+'" onclick="wovFilter(\'await\')">Needs review</button>' +
      '<button class="'+(filter==="approved"?"on":"")+'" onclick="wovFilter(\'approved\')">Approved</button>' +
      '<button class="'+(filter==="all"?"on":"")+'" onclick="wovFilter(\'all\')">All</button>' +
      '</div>';
  }
  window.wovFilter = function(f){ filter=f; renderList(); };
  window.wovSearch = function(v){ searchQuery=v; renderList(); };

  function updateCharCount(){
    var box=document.getElementById("storybox");
    var cc=document.getElementById("charcount");
    if(box && cc) cc.textContent = box.value.length + " chars";
  }

  window.wovOpen = function(idx){
    var it = items[idx];
    var d = it.date ? new Date(it.date).toLocaleString() : "";
    app.innerHTML =
      '<a class="back" onclick="wovBack()">\u2190 Back</a>' +
      '<h1 style="text-align:left;font-size:20px">'+esc(it.name||"?")+'</h1>' +
            '<div class="meta" style="margin-bottom:6px">'+esc(d)+(it.sourceFileName?' \u00b7 '+esc(it.sourceFileName):'')+'</div>' +
      (it.sourceFileId?'<button class="small" id="playbtn" onclick="wovPlayAudio(\''+it.sourceFileId+'\')">\ud83d\udd0a Play recording</button><div id="audiobox" style="margin:10px 0"></div>':'') +
      '<span class="badge '+badgeClass(it.status)+'">'+esc(it.status||"Awaiting review")+'</span>' +
      '<div class="section-lbl">Transcript (her real words)</div>' +
      '<div class="transcript">'+esc(it.transcript||"(none captured)")+'</div>' +
      '<div class="section-lbl">Story \u2014 edit freely, or replace with your own quote from above</div>' +
      '<textarea id="storybox" oninput="updateCC()">'+esc(it.draft||"")+'</textarea>' +
      '<div class="toolrow">' +
        '<button class="small" onclick="wovCopy()">\ud83d\udccb Copy</button>' +
        '<button class="small" onclick="wovReset('+idx+')">\u21ba Reset</button>' +
        '<span class="charcount" id="charcount"></span>' +
      '</div>' +
      '<div class="btnrow">' +
        '<button class="edit" id="editbtn" onclick="wovSave('+idx+',\'\u270f\ufe0f Needs edit\')">Needs more work</button>' +
        '<button class="approve" id="approvebtn" onclick="wovSave('+idx+',\'\u2705 Approved\')">Approve</button>' +
      '</div>' +
      '<button class="danger" id="delbtn" onclick="wovDeleteTap('+idx+')">\ud83d\uddd1 Delete this story</button>' +
      '<div class="status" id="savemsg"></div>';
    updateCharCount();
  };

  var deleteArmed = null, deleteTimer = null;
  window.wovDeleteTap = function(idx){
    var btn = document.getElementById("delbtn");
    if(deleteArmed === idx){
      clearTimeout(deleteTimer); deleteArmed = null;
      wovDelete(idx);
      return;
    }
    deleteArmed = idx;
    btn.textContent = "\u26a0\ufe0f Tap again to permanently delete";
    btn.style.background = "#B3261E"; btn.style.color = "#fff";
    deleteTimer = setTimeout(function(){
      deleteArmed = null;
      btn.textContent = "\ud83d\uddd1 Delete this story";
      btn.style.background = "#fff"; btn.style.color = "#B3261E";
    }, 4000);
  };

  window.updateCC = updateCharCount;
  window.wovBack = function(){ renderList(); };
  window.wovPlayAudio = async function(fileId){
    var btn = document.getElementById("playbtn");
    var box = document.getElementById("audiobox");
    btn.disabled = true; btn.textContent = "Loading\u2026";
    try{
      var r = await fetch(EXEC + "?action=audioFile&id=" + encodeURIComponent(fileId) + "&key=" + encodeURIComponent(KEY));
      var data = await r.json();
      if(data.error){ box.textContent = "\u26a0 " + data.error; btn.disabled=false; btn.textContent="\ud83d\udd0a Play recording"; return; }
      var byteChars = atob(data.audio);
      var byteArr = new Uint8Array(byteChars.length);
      for(var i=0;i<byteChars.length;i++) byteArr[i] = byteChars.charCodeAt(i);
      var blob = new Blob([byteArr], { type: data.mime || "audio/mpeg" });
      var url = URL.createObjectURL(blob);
      box.innerHTML = '<audio controls autoplay src="'+url+'" style="width:100%"></audio>';
      btn.style.display = "none";
    }catch(err){ box.textContent = "\u26a0 " + err; btn.disabled=false; btn.textContent="\ud83d\udd0a Play recording"; }
  };

    window.wovReset = function(idx){
    document.getElementById("storybox").value = items[idx].draft || "";
    updateCharCount();
  };

  window.wovCopy = async function(){
    var box = document.getElementById("storybox");
    try{ await navigator.clipboard.writeText(box.value); }
    catch(e){ box.select(); try{ document.execCommand("copy"); }catch(e2){} }
    var msg=document.getElementById("savemsg"); if(msg) msg.textContent="Copied \u2713";
  };

  window.wovSave = async function(idx, status){
    var it = items[idx];
    var text = document.getElementById("storybox").value;
    var eb=document.getElementById("editbtn"), ab=document.getElementById("approvebtn");
    if(eb) eb.disabled=true; if(ab) ab.disabled=true;
    document.getElementById("savemsg").textContent = "Saving\u2026";
    try{
      await fetch(EXEC, { method:"POST", mode:"no-cors",
        headers:{ "Content-Type":"text/plain;charset=utf-8" },
        body: JSON.stringify({ action:"storyUpdate", key:KEY, row:it.row, finalStory:text, status:status }) });
      it.draft = text; it.status = status;
      document.getElementById("savemsg").textContent = "\u2713 Saved";
      setTimeout(function(){ renderList(); }, 700);
    }catch(err){
      document.getElementById("savemsg").textContent = "\u26a0 " + err;
    }
  };

  window.wovDelete = async function(idx){
    var it = items[idx];
    document.getElementById("savemsg").textContent = "Deleting\u2026";
    try{
      await fetch(EXEC, { method:"POST", mode:"no-cors",
        headers:{ "Content-Type":"text/plain;charset=utf-8" },
        body: JSON.stringify({ action:"storyDelete", key:KEY, row:it.row }) });
      loadAll();
    }catch(err){
      document.getElementById("savemsg").textContent = "\u26a0 " + err;
    }
  };

  function loadAll(){
    if(!KEY){ renderList(); return; }
    fetch(EXEC + "?action=storiesList&key=" + encodeURIComponent(KEY))
      .then(function(r){ return r.json(); })
      .then(function(data){ items = (data && data.items) || []; renderList(); })
      .catch(function(e){ app.innerHTML = "<div class='status'>Could not load: "+e+"</div>"; });
  }

  loadAll();
})();
</script>
</body>
</html>
