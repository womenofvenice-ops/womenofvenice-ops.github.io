<!DOCTYPE html>
<!-- WoV Stories & Director Dossier Review v3.2 (Multi-Take Progression & Talent Feedback) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WoV Talent & Stories</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ 
    --cream:#F4ECDE; --ink:#1C2B2C; --inkS:#5A6667; 
    --red:#A8492E; --peach:#E09A73; --gold:#C7A463; 
    --cardBg:#FFFFFF; --boxBg:#F9F6F0;
  }
  *{ box-sizing:border-box; margin:0; }
  body{ font-family:'Inter',Arial,sans-serif; background:var(--cream); color:var(--ink); min-height:100vh; padding:20px 16px 50px; }
  h1{ font-family:'Playfair Display',Georgia,serif; font-size:24px; text-align:center; margin-bottom:16px; }
  .list{ display:flex; flex-direction:column; gap:12px; }
  .card{ background:var(--cardBg); border-radius:16px; padding:16px; box-shadow:0 2px 10px rgba(28,43,44,.06); cursor:pointer; transition:transform .15s ease; }
  .card:active{ transform:scale(.98); }
  .card .name{ font-weight:700; font-size:17px; }
  .card .archetype-tag{ display:inline-block; font-size:11px; font-weight:600; color:var(--red); background:#FDF2EE; padding:2px 8px; border-radius:6px; margin-top:4px; }
  .card .meta{ font-size:12px; color:var(--inkS); margin-top:4px; }
  .badge{ display:inline-block; font-size:11px; font-weight:700; padding:3px 10px; border-radius:99px; margin-top:6px; }
  .b-await{ background:#F3E3C4; color:#7A5A1E; }
  .b-approved{ background:#CFE3CF; color:#2E5B2E; }
  .b-edit{ background:#F0D0C8; color:#8A3A28; }
  .back{ display:inline-block; margin-bottom:14px; color:var(--red); font-weight:700; font-size:14px; cursor:pointer; }
  .section-lbl{ font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--peach); font-weight:700; margin:18px 0 8px; }
  
  /* DIRECTOR DOSSIER STYLING */
  .dossier-box{ background:#fff; border-radius:14px; padding:16px; border:1px solid rgba(28,43,44,.1); margin-bottom:14px; }
  .d-row{ margin-bottom:10px; font-size:13.5px; line-height:1.5; }
  .d-row:last-child{ margin-bottom:0; }
  .d-title{ font-weight:700; color:var(--ink); font-size:12px; text-transform:uppercase; letter-spacing:.05em; margin-bottom:2px; }
  .d-coach{ background:#FFFBF5; border-left:3.5px solid var(--gold); }
  .d-hook{ background:#FDF7F4; border-left:3.5px solid var(--red); }
  .d-feedback{ background:#F0FDF4; border-left:3.5px solid #22C55E; }
  /* --- 📊 PERFORMANCE TELEMETRY & COMPS STYLING --- */
  .meter-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:12.5px; }
  .meter-row:last-child{ margin-bottom:0; }
  .meter-label{ flex:0 0 170px; font-weight:600; color:var(--ink); }
  .meter-bar{ flex:1; height:8px; background:rgba(28,43,44,.08); border-radius:99px; overflow:hidden; position:relative; }
  .meter-fill{ height:100%; border-radius:99px; background:linear-gradient(90deg, #A8492E, #E09A73); }
  .meter-val{ flex:0 0 35px; text-align:right; font-weight:700; font-size:12px; color:var(--red); }
  .d-format{ background:#FAF5FF; border-left:3.5px solid #8B5CF6; }
  .d-comps{ background:#FFFBF5; border-left:3.5px solid #D97706; }
  /* Mobile Responsive Telemetry Bars (Point 2 & 3) */
  @media (max-width: 480px) {
    .meter-row { flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
    .meter-label { flex: 1 0 70%; font-size: 12px; }
    .meter-val { flex: 0 0 25%; font-size: 12px; text-align: right; }
    .meter-bar { flex: 1 0 100%; height: 7px; margin-top: 2px; }
  }
  .d-progression{ background:#EFF6FF; border-left:3.5px solid #3B82F6; }
  .soundbite-pill{ font-family:'Playfair Display',Georgia,serif; font-style:italic; font-size:15px; color:var(--red); margin-top:4px; }

  .transcript{ background:#fff; border-radius:14px; padding:14px; font-size:14.5px; line-height:1.6; color:var(--inkS); white-space:pre-line; border:1px solid rgba(28,43,44,.08); }
  textarea{ width:100%; min-height:160px; border:1.5px solid rgba(28,43,44,.2); border-radius:14px; padding:14px; font-family:'Inter',Arial,sans-serif; font-size:15px; line-height:1.6; }
  .toolrow{ display:flex; gap:8px; margin-top:8px; align-items:center; flex-wrap:wrap; }
  .charcount{ font-size:12px; color:var(--inkS); margin-left:auto; }
  .btnrow{ display:flex; gap:10px; margin-top:16px; }
  button{ padding:12px 16px; border-radius:30px; border:none; font-weight:700; font-size:14px; cursor:pointer; }
  .approve{ background:var(--red); color:#fff; flex:1; padding:14px; font-size:15px; }
  .edit{ background:#fff; color:var(--red); border:2px solid var(--red); flex:1; padding:14px; font-size:15px; }
  .small{ background:#fff; color:var(--ink); border:1.5px solid rgba(28,43,44,.2); font-size:12px; padding:8px 12px; }
  .danger{ background:#fff; color:#B3261E; border:1.5px solid #B3261E; margin-top:20px; width:100%; padding:12px; }
  .status{ text-align:center; margin-top:14px; font-size:14px; color:var(--inkS); }
  .filterrow{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; justify-content:center; }
  .filterrow button{ padding:8px 14px; font-size:12px; background:#fff; color:var(--ink); border:1.5px solid rgba(28,43,44,.2); }
  .filterrow button.on{ background:var(--ink); color:#fff; border-color:var(--ink); }

  /* UNLOCK BOX */
  .auth-box{ background:#fff; max-width:340px; margin:40px auto; padding:24px; border-radius:16px; box-shadow:0 4px 15px rgba(28,43,44,.08); text-align:center; }
  .auth-box input{ width:100%; padding:12px; border:1.5px solid rgba(28,43,44,.2); border-radius:10px; font-size:14px; margin:14px 0; outline:none; }
  .auth-box button{ width:100%; background:var(--red); color:#fff; padding:12px; border-radius:10px; font-size:14px; }
</style>
</head>
<body>
  <h1>✦ WoV Talent & Stories</h1>
  <div id="app">Loading…</div>

<script>
(function(){
  var EXEC = "https://script.google.com/macros/s/AKfycbw1sia4uM2Xfc3_xP4umiZAPC77_XAyS4R86_oRgV1HHfM1CNRdRCG31SuCqJwFMc8/exec";
 window.EXEC = EXEC; // 👈 ADD THIS ONE LINE!
  var rawUrlKey = new URLSearchParams(window.location.search).get("key") || "";
  var KEY = (rawUrlKey || localStorage.getItem("wov_review_key") || "").trim().replace(/^["']|["']$/g, "");
  if (rawUrlKey) localStorage.setItem("wov_review_key", KEY);
 window.KEY = KEY;   // 👈 OPTIONAL: Also makes your auth key globally available
  var ACTIVE_TALENT = localStorage.getItem("wov_active_talent") || null;
  var app = document.getElementById("app");
  var items = [];
  var filter = "await";
  var searchQuery = "";
  var currentTalent = null;

  function esc(s){ return String(s||"").replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function badgeClass(s){ s=(s||"").toLowerCase(); if(s.indexOf("approved")>=0) return "b-approved"; if(s.indexOf("edit")>=0) return "b-edit"; return "b-await"; }

  function renderUnlock(){
    app.innerHTML = 
      '<div class="auth-box">' +
        '<div style="font-weight:700;font-size:16px;margin-bottom:6px">Director Authentication</div>' +
        '<div style="font-size:12.5px;color:var(--inkS)">Enter private access key to unlock talent dossiers.</div>' +
        '<input type="password" id="keyInput" placeholder="Private Access Key">' +
        '<button onclick="wovUnlock()">Unlock Dashboard</button>' +
        '<div id="authErr" style="color:var(--red);font-size:12px;margin-top:10px"></div>' +
      '</div>';
  }

  window.wovUnlock = function(){
    var input = document.getElementById("keyInput");
    var val = input ? input.value.trim().replace(/^["']|["']$/g, "") : "";
    if(!val) return;
    KEY = val;
    localStorage.setItem("wov_review_key", KEY);
    app.innerHTML = "Authenticating…";
    loadAll();
  };

  // --- 🎬 MULTI-TAKE UNIFIED TALENT GROUPER ---
  function getGroupedTalent(rawItems) {
    var grouped = {};
    var order = [];

    rawItems.forEach(function(it) {
      var clean = (it.name || "Talent").replace(/\s*\(Take\s*\d+\)/i, "").trim();
      var key = clean.toLowerCase();

      if (!grouped[key]) {
        grouped[key] = {
          baseName: clean,
          latestTake: it,
          takes: [],
          instagram: it.instagram || "",
          email: it.email || "",
          phone: it.phone || "",
          targetFormat: it.targetFormat || "",
          intakeNotes: it.intakeNotes || "",
          status: it.status || "Awaiting review",
          isNewIntake: it.isNewIntake || false
        };
        order.push(key);
      }

      grouped[key].takes.push(it);

      if (new Date(it.date) >= new Date(grouped[key].latestTake.date)) {
        grouped[key].latestTake = it;
        grouped[key].status = it.status;
        if (it.targetFormat) grouped[key].targetFormat = it.targetFormat;
        if (it.instagram) grouped[key].instagram = it.instagram;
        if (it.phone) grouped[key].phone = it.phone;
        if (it.email) grouped[key].email = it.email;
        if (it.intakeNotes) grouped[key].intakeNotes = it.intakeNotes;
      }
    });

    order.forEach(function(k) {
      grouped[k].takes.sort(function(a, b) {
        return new Date(b.date) - new Date(a.date);
      });
    });

    return order.map(function(k) { return grouped[k]; });
  }

  function filterButtons(){
    return '<div class="filterrow">' +
      '<button class="'+(filter==="await"?"on":"")+'" onclick="wovFilter(\'await\')">Needs review</button>' +
      '<button class="'+(filter==="approved"?"on":"")+'" onclick="wovFilter(\'approved\')">Approved</button>' +
      '<button class="'+(filter==="all"?"on":"")+'" onclick="wovFilter(\'all\')">All</button>' +
      '</div>';
  }
  window.wovFilter = function(f){ filter=f; renderList(); };
  window.wovSearch = function(v){ searchQuery=v; renderList(); };
  
  // 1-Tap Search Clear (✕)
  window.wovClearSearch = function(){
    searchQuery = "";
    var box = document.getElementById("searchbox");
    if(box) box.value = "";
    renderList();
  };

  function updateCharCount(){
    var box = document.getElementById("storybox");
    var cc = document.getElementById("charcount");
    if(box && cc) cc.textContent = box.value.length + " chars";
  }
  window.updateCC = updateCharCount;

  function renderList(){
    if(!KEY){ renderUnlock(); return; }

    var topBarEl = document.getElementById("topBar");
    if(!topBarEl){
      app.innerHTML = 
        '<div id="topBar">' + filterButtons() +
        '<div style="position:relative;margin-bottom:14px;">' +
          '<input type="text" id="searchbox" placeholder="Search talent by name…" value="' + esc(searchQuery) + '" ' +
          'oninput="wovSearch(this.value)" style="width:100%;padding:12px 38px 12px 14px;border-radius:14px;border:1.5px solid rgba(28,43,44,.2);font-size:15px;box-sizing:border-box;">' +
          '<button onclick="wovClearSearch()" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:var(--inkS);font-size:16px;cursor:pointer;padding:6px 10px;">✕</button>' +
        '</div>' +
        '</div>' +
        '<div id="listContainer"></div>';
    }

    var allTalent = getGroupedTalent(items);

    var filtered = allTalent.filter(function(t){
      var s = (t.status||"").toLowerCase();
      var statusOk = filter==="all" ? true : (filter==="approved" ? s.indexOf("approved")>=0 : s.indexOf("approved")<0);
      var searchOk = !searchQuery || t.baseName.toLowerCase().indexOf(searchQuery.toLowerCase())>=0;
      return statusOk && searchOk;
    });

    var listEl = document.getElementById("listContainer");
    if(!listEl) return;

    if(!filtered.length){ 
      listEl.innerHTML = "<div class='status'>No profiles found.</div>"; 
      return; 
    }
    
    var html = '<div class="list">';
    filtered.forEach(function(t){
      var d = t.latestTake.date ? new Date(t.latestTake.date).toLocaleDateString() : "";
      var dos = t.latestTake.dossier || {};
      if (typeof dos === "string") { try { dos = JSON.parse(dos); } catch(e){ dos = {}; } }
      var arch = (dos.castingDossier && dos.castingDossier.marketArchetype) ? dos.castingDossier.marketArchetype : (t.targetFormat || "");
      var takeLabel = t.isNewIntake ? "⏳ Awaiting First Take" : ("🎬 " + t.takes.length + (t.takes.length === 1 ? " Take" : " Takes"));

      html += '<div class="card" onclick="wovOpenTalentByName(\''+esc(t.baseName).replace(/'/g, "\\'")+'\')">' +
        '<div class="name">'+esc(t.baseName)+'</div>' +
        (arch ? '<span class="archetype-tag">🎭 '+esc(arch)+'</span>' : '') +
        '<span class="archetype-tag" style="background:#EBF5FF;color:#0969DA;margin-left:4px;">'+takeLabel+'</span>' +
        '<div class="meta">'+d+'</div>' +
        '<span class="badge '+badgeClass(t.status)+'">'+esc(t.status||"Awaiting review")+'</span>' +
        '</div>';
    });
    html += '</div>';
    listEl.innerHTML = html;
  }

  // Exact Name Match Opener
  window.wovOpenTalentByName = function(talentName){
    var allTalent = getGroupedTalent(items);
    var matched = allTalent.find(function(x){ return x.baseName.toLowerCase() === talentName.toLowerCase(); });
    if(matched) wovRenderProfile(matched);
  };

  function wovRenderProfile(t){
    currentTalent = t;
    var activeTalentName = (typeof ACTIVE_TALENT !== "undefined" && ACTIVE_TALENT) ? ACTIVE_TALENT : (localStorage.getItem("wov_active_talent") || "");
    var isActive = activeTalentName && (activeTalentName.toLowerCase() === t.baseName.toLowerCase());

    var sessionStatusHtml = "";
    if (isActive) {
      sessionStatusHtml = 
        '<div style="background:#F0FDF4;border:1.5px solid #22C55E;border-radius:12px;padding:14px;text-align:center;margin:12px 0 16px;">' +
          '<div style="color:#166534;font-weight:700;font-size:15px;">🟢 SESSION ACTIVE IN CLOUD</div>' +
          '<div style="color:#15803D;font-size:12.5px;margin-top:4px;">Ready for next take in Open Camera. Tap Camera Widget to offload.</div>' +
        '</div>';
    } else {
      sessionStatusHtml = 
        '<div style="margin:12px 0 16px;">' +
          '<button id="activateBtn" style="width:100%;background:#1F6FEB;color:#fff;padding:12px;border-radius:12px;font-size:14px;font-weight:700;" onclick="wovActivateCallbackForName(\''+esc(t.baseName).replace(/'/g, "\\'")+'\','+t.takes.length+')">' +
            '🎬 Activate Session for ' + esc(t.baseName) +
          '</button>' +
        '</div>';
    }

    // Direct Actionable Contacts (WhatsApp, Phone, Instagram, Email)
    var cleanPhone = (t.phone||"").replace(/[^\d+]/g, "");
    var contactHtml = 
      '<div class="section-lbl">📱 Talent Contact & Intake Profile</div>' +
      '<div class="dossier-box" style="background:#fff;border-left:3.5px solid #58A6FF;">' +
        (t.targetFormat ? '<div class="d-row"><div class="d-title">🎯 Target Ambition</div><b>'+esc(t.targetFormat)+'</b></div>' : '') +
        (t.instagram ? '<div class="d-row"><div class="d-title">📸 Instagram / Portfolio</div><a href="https://instagram.com/'+esc(t.instagram).replace('@','')+'" target="_blank" style="color:#58A6FF;text-decoration:none;font-weight:600;">'+esc(t.instagram)+' ↗</a></div>' : '') +
        (t.phone ? '<div class="d-row"><div class="d-title">📞 Phone & WhatsApp</div><a href="tel:'+cleanPhone+'" style="color:#1C2B2C;text-decoration:none;font-weight:600;">'+esc(t.phone)+'</a> &nbsp;·&nbsp; <a href="https://wa.me/'+cleanPhone.replace('+','')+'" target="_blank" style="color:#22C55E;text-decoration:none;font-weight:600;">💬 Open WhatsApp ↗</a></div>' : '') +
        (t.email ? '<div class="d-row"><div class="d-title">✉️ Email Address</div><a href="mailto:'+esc(t.email)+'" style="color:#58A6FF;text-decoration:none;font-weight:600;">'+esc(t.email)+' ↗</a></div>' : '') +
        (t.intakeNotes ? '<div class="d-row"><div class="d-title">📝 Intake Directing Notes</div>'+esc(t.intakeNotes)+'</div>' : '') +
      '</div>';

    // Multi-Take Timeline
    var takesHtml = "";
    if (t.isNewIntake || t.takes.length === 0) {
      takesHtml = 
        '<div class="dossier-box" style="background:#FFFBF5;border-left:3.5px solid #C7A463;margin-top:14px;">' +
          '<div style="font-weight:700;font-size:14px;color:#7A5A1E;margin-bottom:4px;">⏳ Awaiting First Audition Scene</div>' +
          '<div style="font-size:13px;color:#5A6667;line-height:1.5;">Legal consent waiver signed on file. Ready to record Take #1 in Open Camera!</div>' +
        '</div>';
    } else {
      t.takes.forEach(function(takeItem, idx){
        var dos = takeItem.dossier || {};
        if (typeof dos === "string") { try { dos = JSON.parse(dos); } catch(e){ dos = {}; } }
        var cast = dos.castingDossier || {};
        var dir = dos.directorNotes || {};
        var takeNum = dos.takeNumber || (t.takes.length - idx);
        var fId = takeItem.sourceFileId || "";
  
    // CONTAINER 1: 📊 PERFORMANCE TELEMETRY RADAR (HARDENED & ACCESSIBLE)
        function safeScore(val) {
          var n = Number(val);
          return (!isNaN(n) && n >= 0 && n <= 100) ? Math.round(n) : null;
        }

        var radar = dos.performanceRadar || null;
        var radarHtml = "";
        if (radar) {
          var pScore = safeScore(radar.presenceScore);
          var vScore = safeScore(radar.vocalScore);
          var sScore = safeScore(radar.subtextScore);
          var fScore = safeScore(radar.formatFitScore);

          radarHtml = 
            '<div class="section-lbl">📊 Performance Telemetry (1-100)</div>' +
            '<div class="dossier-box">' +
              (pScore !== null ? 
                '<div class="meter-row">' +
                  '<div class="meter-label">👁️ Camera Stillness & Presence</div>' +
                  '<div class="meter-bar" role="progressbar" aria-valuenow="'+pScore+'" aria-valuemin="0" aria-valuemax="100"><div class="meter-fill" style="width:'+pScore+'%;"></div></div>' +
                  '<div class="meter-val">'+pScore+'</div>' +
                '</div>' : '') +
              (vScore !== null ? 
                '<div class="meter-row">' +
                  '<div class="meter-label">🎙️ Vocal Resonance & Control</div>' +
                  '<div class="meter-bar" role="progressbar" aria-valuenow="'+vScore+'" aria-valuemin="0" aria-valuemax="100"><div class="meter-fill" style="width:'+vScore+'%;"></div></div>' +
                  '<div class="meter-val">'+vScore+'</div>' +
                '</div>' : '') +
              (sScore !== null ? 
                '<div class="meter-row">' +
                  '<div class="meter-label">🎭 Subtext & Emotional Truth</div>' +
                  '<div class="meter-bar" role="progressbar" aria-valuenow="'+sScore+'" aria-valuemin="0" aria-valuemax="100"><div class="meter-fill" style="width:'+sScore+'%;"></div></div>' +
                  '<div class="meter-val">'+sScore+'</div>' +
                '</div>' : '') +
              (fScore !== null ? 
                '<div class="meter-row">' +
                  '<div class="meter-label">🎯 Target Format Alignment</div>' +
                  '<div class="meter-bar" role="progressbar" aria-valuenow="'+fScore+'" aria-valuemin="0" aria-valuemax="100"><div class="meter-fill" style="width:'+fScore+'%;"></div></div>' +
                  '<div class="meter-val">'+fScore+'</div>' +
                '</div>' : '') +
            '</div>';
        }

        // CONTAINER 2: 🎯 FORMAT-SPECIFIC AMBITION DIAGNOSTIC
        var fmtDiag = dos.formatDiagnostic || null;
        var formatDiagHtml = "";
        if (fmtDiag) {
          formatDiagHtml = 
            '<div class="section-lbl">🎯 ' + esc(fmtDiag.focusTitle || "Target Ambition Diagnostic") + '</div>' +
            '<div class="dossier-box d-format">' +
              '<div class="d-row"><div class="d-title">Format Evaluation</div>' + esc(fmtDiag.coreFinding || "-") + '</div>' +
              '<div class="d-row"><div class="d-title">Market / Platform Viability</div><b>' + esc(fmtDiag.viabilityAssessment || "-") + '</b></div>' +
            '</div>';
        }

        // CONTAINER 3: 🎬 INDUSTRY REFERENCE COMPS
        var comps = dos.referenceComps || null;
        var compsHtml = "";
        if (comps && (comps.actorComps || comps.directorFit)) {
          compsHtml = 
            '<div class="section-lbl">🎬 Industry Reference Comps & Market Fit</div>' +
            '<div class="dossier-box d-comps">' +
              (comps.actorComps ? '<div class="d-row"><div class="d-title">Actor Energy Comps</div><b>' + esc(comps.actorComps) + '</b></div>' : '') +
              (comps.directorFit ? '<div class="d-row"><div class="d-title">Director / Brand Matches</div>' + esc(comps.directorFit) + '</div>' : '') +
            '</div>';
        }

        takesHtml += 
          '<div style="margin-top:20px;padding:16px;background:#F9F6F0;border-radius:14px;border:1.5px solid rgba(28,43,44,.1);">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">' +
              '<div style="font-weight:700;font-size:16px;color:#A8492E;">🎬 Take #' + takeNum + '</div>' +
              '<div style="font-size:12px;color:var(--inkS);">' + new Date(takeItem.date).toLocaleDateString() + '</div>' +
            '</div>' +
            
            // Dedicated Take Audio Player
            (fId ? '<div style="margin:10px 0;"><button class="small" id="playbtn_'+fId+'" onclick="wovPlayTakeAudio(\''+fId+'\')">🔊 Play recording</button><div id="audiobox_'+fId+'" style="margin-top:8px;"></div></div>' : '') +
     
          // 📊 THE 3 EXPANDED CONTAINERS (Telemetry, Ambition, Comps)
            radarHtml +
            formatDiagHtml +
            compsHtml +

            // 💌 Critique for Actress with 1-Click Email & Video Playback (Triple-Checked)
            (dos.talentFeedback ? (function() {
              var candName = (t && t.name) || (takeItem && takeItem.name) || "Talent";
              var firstName = candName.split(" ")[0] || "Talent";
              var candEmail = (t && (t.email || t.contactEmail || t.contact)) || "";
              var vidUrl = (dos && dos.videoUrl) || ""; // 👈 1. Grabs the video preview link
              var domId = "feedback_text_" + (fId ? fId.replace(/[^a-zA-Z0-9_-]/g, "") : ("take_" + takeNum));
              var safeJsName = esc(candName).replace(/'/g, "\\'");
              var safeJsEmail = esc(candEmail).replace(/'/g, "\\'");
              var safeJsVid = esc(vidUrl).replace(/'/g, "\\'"); // 👈 2. Safely escaped video link

              return '<div class="dossier-box d-feedback" style="margin-top:10px;">' +
                '<div class="d-title">💌 Critique for Actress</div>' +
                '<div id="' + domId + '" style="font-size:14px;line-height:1.5;margin-bottom:10px;">' + esc(dos.talentFeedback) + '</div>' +
                '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">' +
                  '<button class="small" onclick="var el=document.getElementById(\'' + domId + '\'); if(el){ navigator.clipboard.writeText(el.innerText); alert(\'Feedback copied!\'); }">📋 Copy Feedback</button>' +
                  (candEmail ? '<button class="small" style="background:#A8492E;color:#fff;font-weight:700;" onclick="wovEmailCritique(\'' + safeJsName + '\',' + takeNum + ',\'' + domId + '\',\'' + safeJsEmail + '\',\'' + safeJsVid + '\')">✉️ Email Directing Note to ' + esc(firstName) + '</button>' : '') +
                  (vidUrl ? '<a href="' + esc(vidUrl) + '" target="_blank" class="small" style="display:inline-block;padding:6px 12px;background:#1C2B2C;color:#fff;text-decoration:none;border-radius:6px;font-size:12px;font-weight:700;">🎬 Watch Video</a>' : '') +
                '</div>' +
              '</div>';
            })() : '') +
          
            // 🎭 Archetype, Superpower, Blindspot
            '<div class="dossier-box" style="margin-top:10px;">' +
              '<div class="d-row"><div class="d-title">Market Archetype</div><b>' + esc(cast.marketArchetype || "-") + '</b></div>' +
              '<div class="d-row"><div class="d-title">⚡ Superpower</div>' + esc(dir.superpower || "-") + '</div>' +
              '<div class="d-row"><div class="d-title">⚠️ Blindspot</div>' + esc(dir.blindspotToCorrect || "-") + '</div>' +
            '</div>' +

            // 🎙️ Verbatim Transcript (Defensive check across takeItem and dossier)
            '<div class="section-lbl" style="margin-top:14px;">Verbatim Transcript</div>' +
            '<div class="transcript">' + esc(takeItem.transcript || dos.transcript || "(none captured)") + '</div>' +
          '</div>';
      });
    }

    // --- ⏱️ SCENE BEAT MAP & DRAMATIC STRUCTURE (REPLACES PORTFOLIO STORY) ---
    var storySectionHtml = "";
    if (!t.isNewIntake && t.takes.length > 0) {
      var latestDos = t.latestTake.dossier || {};
      if (typeof latestDos === "string") { try { latestDos = JSON.parse(latestDos); } catch(e){ latestDos = {}; } }
      
      var beatMap = latestDos.temporalBeatMap || [];
      var premise = latestDos.scenePremise || "";
      var acoustics = latestDos.acousticMetrics || {};

      var beatsHtml = '<div class="section-lbl" style="margin-top:16px;">⏱️ Scene Beat Breakdown & Dramatic Structure</div>' +
        '<div class="dossier-box" style="background:#FAFBFB;border-left:3.5px solid #0EA5E9;">';

      if (premise) {
        beatsHtml += '<div style="font-size:12.5px;color:var(--ink);margin-bottom:8px;"><b>Dramatic Premise:</b> ' + esc(premise) + '</div>';
      }

      // Acoustic Metrics Telemetry Bar
      if (acoustics.estimatedWpm || acoustics.dominantVocalRegister) {
        beatsHtml += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid rgba(28,43,44,.08);font-size:11.5px;color:var(--inkS);">' +
          (acoustics.estimatedWpm ? '<span style="background:rgba(28,43,44,.06);padding:3px 7px;border-radius:6px;">⚡ ~' + esc(acoustics.estimatedWpm) + ' WPM</span>' : '') +
          (acoustics.pauseFrequency ? '<span style="background:rgba(28,43,44,.06);padding:3px 7px;border-radius:6px;">⏸️ Pauses: ' + esc(acoustics.pauseFrequency) + '</span>' : '') +
          (acoustics.dominantVocalRegister ? '<span style="background:rgba(28,43,44,.06);padding:3px 7px;border-radius:6px;">🎙️ ' + esc(acoustics.dominantVocalRegister) + '</span>' : '') +
        '</div>';
      }

      // Chronological Scene Beats
      if (beatMap.length > 0) {
        beatsHtml += '<div style="display:flex;flex-direction:column;gap:8px;">';
        beatMap.forEach(function(b, bIdx) {
          beatsHtml += '<div style="background:#fff;padding:10px 12px;border-radius:8px;border:1px solid rgba(28,43,44,.08);display:flex;gap:12px;align-items:flex-start;">' +
            '<div style="background:#0F172A;color:#38BDF8;font-family:monospace;font-size:11px;font-weight:700;padding:3px 6px;border-radius:5px;white-space:nowrap;letter-spacing:0.5px;">' +
              esc(b.timestamp || ("Beat " + (bIdx + 1))) +
            '</div>' +
            '<div style="flex:1;">' +
              '<div style="font-weight:700;font-size:12.5px;color:var(--ink);margin-bottom:2px;">' + esc(b.beatTitle || ("Beat #" + (bIdx + 1))) + '</div>' +
              (b.characterIntent ? '<div style="font-size:12px;color:var(--ink);line-height:1.4;">' + esc(b.characterIntent) + '</div>' : '') +
              (b.acousticBehavior ? '<div style="font-size:11px;color:var(--inkS);margin-top:3px;font-style:italic;">Acoustics: ' + esc(b.acousticBehavior) + '</div>' : '') +
            '</div>' +
          '</div>';
        });
        beatsHtml += '</div>';
      } else {
        beatsHtml += '<div style="font-size:12px;color:var(--inkS);font-style:italic;">Scene analysis established. Detailed temporal beat map activates on clean takes.</div>';
      }

      beatsHtml += '</div>';

      // Preserves your Approve & Needs work buttons
      storySectionHtml = beatsHtml +
        '<div class="btnrow" style="margin-top:14px;">' +
          '<button class="edit" id="editbtn" onclick="wovSaveTalentStatus(\'✏️ Needs edit\')">Needs work</button>' +
          '<button class="approve" id="approvebtn" onclick="wovSaveTalentStatus(\'✅ Approved\')">Approve</button>' +
        '</div>';
    }

    app.innerHTML = 
      '<a class="back" onclick="wovBack()">← Back to Talent Roster</a>' +
      '<h1 style="text-align:left;font-size:24px;margin-bottom:4px;">'+esc(t.baseName)+'</h1>' +
      '<div style="font-size:13px;color:#5A6667;margin-bottom:12px;">🎬 '+t.takes.length+' Takes on file</div>' +
      sessionStatusHtml +
      contactHtml +
      takesHtml +
      storySectionHtml +
      '<button class="danger" style="margin-top:24px;" onclick="wovDeleteTalentAll(\''+esc(t.baseName).replace(/'/g, "\\'")+'\')">🗑 Delete this talent profile</button>' +
      '<div class="status" id="savemsg"></div>';

    if (document.getElementById("storybox")) {
      updateCharCount();
    }
  }

  // Audio Player
  window.wovPlayTakeAudio = async function(fileId){
    var btn = document.getElementById("playbtn_" + fileId);
    var box = document.getElementById("audiobox_" + fileId);
    if(btn) { btn.disabled = true; btn.textContent = "Loading audio…"; }
    try{
      var r = await fetch(EXEC + "?action=audioFile&id=" + encodeURIComponent(fileId) + "&key=" + encodeURIComponent(KEY));
      var data = await r.json();
      if(data.error){ if(box) box.textContent = "⚠️ " + data.error; if(btn){ btn.disabled=false; btn.textContent="🔊 Play recording"; } return; }
      var byteChars = atob(data.audio);
      var byteArr = new Uint8Array(byteChars.length);
      for(var i=0;i<byteChars.length;i++) byteArr[i] = byteChars.charCodeAt(i);
      var blob = new Blob([byteArr], { type: data.mime || "audio/mp4" });
      var url = URL.createObjectURL(blob);
      if(box) box.innerHTML = '<audio controls autoplay src="'+url+'" style="width:100%"></audio>';
      if(btn) btn.style.display = "none";
    }catch(err){ if(box) box.textContent = "⚠️ " + err; if(btn){ btn.disabled=false; btn.textContent="🔊 Play recording"; } }
  };

  // Narrative Story Controls
  window.wovCopyStory = async function(){
    var box = document.getElementById("storybox");
    if(!box) return;
    try{ await navigator.clipboard.writeText(box.value); }
    catch(e){ box.select(); try{ document.execCommand("copy"); }catch(e2){} }
    var msg = document.getElementById("savemsg"); if(msg) msg.textContent = "Story copied ✓";
  };

  window.wovResetStory = function(){
    var box = document.getElementById("storybox");
    if(box && currentTalent && currentTalent.latestTake){
      box.value = currentTalent.latestTake.draft || "";
      updateCharCount();
    }
  };

  window.wovSaveTalentStatus = async function(status){
    if(!currentTalent || !currentTalent.latestTake) return;
    var box = document.getElementById("storybox");
    var text = box ? box.value : "";
    var eb = document.getElementById("editbtn"), ab = document.getElementById("approvebtn");
    if(eb) eb.disabled = true; if(ab) ab.disabled = true;
    var msg = document.getElementById("savemsg");
    if(msg) msg.textContent = "Saving…";

    try{
      await fetch(EXEC, { 
        method: "POST", 
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "storyUpdate", key: KEY, rowId: currentTalent.latestTake.rowId, finalStory: text, status: status }) 
      });
      currentTalent.latestTake.draft = text;
      currentTalent.latestTake.status = status;
      currentTalent.status = status;
      if(msg) msg.textContent = "✓ Saved";
      setTimeout(function(){ renderList(); }, 700);
    }catch(err){
      if(msg) msg.textContent = "⚠️ " + err;
    }
  };

  window.wovBack = function(){ 
    document.getElementById("app").innerHTML = ""; 
    renderList(); 
  };

  window.wovActivateCallbackForName = async function(name, takesCount){
    var btn = document.getElementById("activateBtn");
    if(btn){ btn.disabled = true; btn.textContent = "Activating Session in Cloud…"; }

    try {
      await fetch(EXEC, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "activateCallback", key: KEY, name: name, takeCount: takesCount })
      });

      ACTIVE_TALENT = name;
      localStorage.setItem("wov_active_talent", name);
      wovOpenTalentByName(name);
    } catch(err) {
      if(btn){ btn.disabled = false; btn.textContent = "⚠️ Error: " + err; }
    }
  };

  window.wovDeleteTalentAll = function(baseName){
    if(!confirm("Permanently delete " + baseName + " and all her takes?")) return;
    var toDelete = items.filter(function(it){
      return (it.name || "").replace(/\s*\(Take\s*\d+\)/i, "").trim().toLowerCase() === baseName.toLowerCase();
    });
    
    var chain = Promise.resolve();
    toDelete.forEach(function(it){
      chain = chain.then(function(){
        return fetch(EXEC, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "storyDelete", key: KEY, rowId: it.rowId })
        });
      });
    });
    
    chain.then(function(){ loadAll(); });
  };

  function loadAll(){
    if(!KEY){ renderUnlock(); return; }
    fetch(EXEC + "?action=storiesList&key=" + encodeURIComponent(KEY) + "&_t=" + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(data){ 
        if(data && data.error){
          app.innerHTML = '<div class="auth-box"><div style="color:var(--red);font-weight:700;margin-bottom:8px">⚠️ ' + esc(data.error) + '</div><button onclick="localStorage.removeItem(\'wov_review_key\');location.reload();">Re-enter Key</button></div>';
          return;
        }
        items = (data && data.items) || []; 
        if(data && data.activeCandidate){
          ACTIVE_TALENT = data.activeCandidate;
          localStorage.setItem("wov_active_talent", ACTIVE_TALENT);
        }
        renderList(); 
      })
      .catch(function(e){ 
        app.innerHTML = "<div class='status'>Could not load: "+e+"</div>"; 
      });
  }

  loadAll();
})();

 /**
 * Sends critique email via standard fetch to Apps Script Web App (EXEC).
 * Universal endpoint resolution + authentication key binding + video delivery link.
 */
function wovEmailCritique(talentName, takeNum, domIdOrFid, candidateEmail, videoUrl) {
  var feedbackEl = document.getElementById(domIdOrFid) || document.getElementById("feedback_text_" + domIdOrFid);
  var feedbackText = feedbackEl ? feedbackEl.innerText : "";
  
  if (!feedbackText) {
    alert("No feedback text available to send.");
    return;
  }
  
  if (!confirm("Send this directing note directly to " + candidateEmail + "?")) {
    return;
  }

  // Uses EXEC directly, with your exact endpoint as a permanent fallback
  var apiUrl = (typeof EXEC !== "undefined" && EXEC) || 
               window.EXEC || 
               "https://script.google.com/macros/s/AKfycbw1sia4uM2Xfc3_xP4umiZAPC77_XAyS4R86_oRgV1HHfM1CNRdRCG31SuCqJwFMc8/exec";
  
  var authKey = (typeof KEY !== "undefined" && KEY) || window.KEY || localStorage.getItem("wov_review_key") || "";

  var payload = {
    action: "sendCritiqueEmail",
    key: authKey,
    talentName: talentName,
    takeNumber: takeNum,
    feedbackText: feedbackText,
    candidateEmail: candidateEmail,
    videoUrl: videoUrl || "" // 👈 Connects the video playback link!
  };

  fetch(apiUrl, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" }, // Prevents CORS preflight blocks
    body: JSON.stringify(payload)
  })
  .then(function(res) { return res.json(); })
  .then(function(data) {
    if (data && data.ok) {
      alert("✅ " + data.message);
    } else {
      alert("⚠️ " + (data ? data.error : "Failed to send email."));
    }
  })
  .catch(function(err) {
    alert("Network error sending email: " + err);
  });
}
  
</script>
