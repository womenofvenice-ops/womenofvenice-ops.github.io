<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Casting Comp Card (Z-Card) · Women of Venice Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FBF9F5;
      --card-bg: #FFFFFF;
      --text: #1C2B2C;
      --text-light: #64748B;
      --red: #A8492E;
      --border: #E2E8F0;
      --peach: #E09A73;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #EFEAE1;
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
      padding: 30px 16px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      line-height: 1.4;
    }

    /* Screen Control Toolbar */
    .toolbar {
      max-width: 820px;
      width: 100%;
      background: #1C2B2C;
      border: 1px solid rgba(28, 43, 44, 0.2);
      border-radius: 12px;
      padding: 14px 20px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .toolbar-title {
      color: #F8FAFC;
      font-size: 13.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toolbar-actions { display: flex; gap: 10px; }
    .btn-action {
      background: var(--red);
      color: #FFF;
      border: none;
      padding: 9px 20px;
      border-radius: 99px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-action:hover { background: #8a3d28; }
    .btn-secondary { background: #334155; color: #F8FAFC; }
    .btn-secondary:hover { background: #475569; }

    /* Modal for Quick Specs Editing */
    #editModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-card {
      background: #FFF;
      border-radius: 14px;
      max-width: 480px;
      width: 100%;
      padding: 26px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .modal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 16px 0 20px;
    }
    .modal-input {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    .modal-input:focus { border-color: var(--red); }

    /* ================================================= */
    /* 📄 THE COMP CARD SHEET (Precise A4 Dimensions)    */
    /* ================================================= */
    .comp-sheet {
      width: 210mm;
      min-height: 297mm;
      background: #FFF;
      box-shadow: 0 10px 40px rgba(0,0,0,0.12);
      padding: 14mm 15mm 12mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      box-sizing: border-box;
      color: var(--text);
    }

    /* Masthead */
    .comp-masthead {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 2px solid var(--text);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .comp-studio-mark {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text);
    }
    .comp-submark {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--red);
      margin-top: 2px;
    }
    .comp-cert-pill {
      font-family: monospace;
      font-size: 9px;
      font-weight: 700;
      background: #F1F5F9;
      border: 1px solid #CBD5E1;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    /* Main Grid: Left Portrait + Right Specifications */
    .comp-main-grid {
      display: grid;
      grid-template-columns: 86mm 1fr;
      gap: 12mm;
      flex: 1;
      margin-bottom: 8px;
    }

    /* Left: Hero Portrait Box */
    .comp-photo-box {
      width: 100%;
      height: 126mm;
      background: #F8F6F0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
      cursor: pointer;
    }
    .comp-photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .photo-upload-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15,23,42,0.65);
      color: #FFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      padding: 16px;
    }
    .comp-photo-box:hover .photo-upload-overlay { opacity: 1; }
    .comp-photo-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #94A3B8;
      text-align: center;
      padding: 16px;
    }

    /* Right: Specs, Telemetry Radar, Comps */
    .comp-details {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .comp-name-block h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 32px;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.5px;
      color: var(--text);
      margin-bottom: 2px;
    }
    .comp-archetype {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--red);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    /* 🏷️ Specs Grid (Clean 2-Column Tile Badges) */
    .specs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 12px;
      background: #FAF9F6;
      border: 1px solid #EAE5DB;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .spec-item {
      display: flex;
      flex-direction: column;
    }
    .spec-lbl {
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748B;
    }
    .spec-txt {
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 📊 Generous 4-Axis Spider Radar Polygon */
    .radar-box {
      background: #FAF8F5;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      padding: 10px 12px 6px;
      text-align: center;
      margin-bottom: 12px;
    }
    .radar-header {
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #64748B;
      margin-bottom: 2px;
    }

    /* Director & Actor Comps Box */
    .comps-container {
      background: #F8FAFC;
      border-left: 3px solid var(--red);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 10.5px;
      line-height: 1.45;
    }

    /* Bottom: Full-Width Directorial Notes + Scan-to-Watch QR */
    .comp-footer-grid {
      display: grid;
      grid-template-columns: 1fr 34mm;
      gap: 12mm;
      border-top: 1.5px solid var(--text);
      padding-top: 10px;
      align-items: center;
    }
    .directorial-quote {
      font-size: 11px;
      line-height: 1.5;
      color: #334155;
    }
    .directorial-quote b {
      color: var(--text);
      display: block;
      margin-bottom: 2px;
      font-size: 11px;
    }
    .qr-block { text-align: center; }
    .qr-block img {
      width: 26mm;
      height: 26mm;
      display: block;
      margin: 0 auto;
    }
    .qr-caption {
      font-size: 8px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 3px;
      color: #475569;
    }

    /* Responsive Mobile Screen View (<820px) */
    @media screen and (max-width: 820px) {
      body { padding: 12px 8px 48px; }
      .comp-sheet {
        width: 100% !important;
        min-height: auto !important;
        padding: 18px 14px !important;
      }
      .comp-main-grid {
        grid-template-columns: 1fr !important;
        gap: 16px !important;
      }
      .comp-photo-box { height: 360px !important; }
      .comp-footer-grid {
        grid-template-columns: 1fr !important;
        gap: 16px !important;
      }
    }

    @page { size: A4 portrait; margin: 0; }
